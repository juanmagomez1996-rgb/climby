name: una_vida
description: "Una Vida en 20 Minutos: una vida entera en unos minutos de recreativa pintada a mano."
publish_to: 'none'

# Sube el número tras el + en cada subida a Google Play (es el versionCode).
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/bg/
    - assets/chars/
    - assets/items/
    - assets/ev/
    - assets/ui/
    - assets/audio/
  fonts:
    - family: Chewy
      fonts:
        - asset: assets/fonts/Chewy-Regular.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "store/icon_1024.png"
  adaptive_icon_background: "#F3E2C0"
  adaptive_icon_foreground: "store/icon_foreground.png"
  min_sdk_android: 21
