<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>¿Quién Es Real?</title></head><body>
<script src="proto.js"></script>
<script>
// ¿Quién Es Real? — deducción: los parásitos solo fingen recuerdos bonitos.
const G = Proto.create({ onRestart() { newGame(); } });
const C = G.C, ctx = G.ctx, W = G.W;

const N = { mama: 'Mamá', papa: 'Papá', herm: 'Hermana', abu: 'Abuelo', perro: 'Bartolo', prima: 'Prima Vero' };
const REAL = [
  { id: 'mama', name: 'Mamá', col: '#FF9F80', shape: 'blob', acc: 'bun', ac: '#7A4630',
    good: [['La barbacoa del patio. {papa} hizo hamburguesas con forma de corazón.', 'sol'],
      ['Cuando {herm} aprendió a ir en bici. Gritamos tanto que salieron los vecinos.', 'sol'],
      ['Noche de pelis con palomitas quemadas. Nadie se quejó.', 'noche']],
    bad: [['El día que me despidieron. Lloré en el coche para que no me vierais.', 'coche'],
      ['Discutí con {abu} en Navidad. Estuvimos un mes sin hablarnos.', 'casa'],
      ['Olvidé recoger a {herm} del cole. Me esperó dos horas bajo la lluvia.', 'lluvia']] },
  { id: 'papa', name: 'Papá', col: '#6FA8FF', shape: 'wide', acc: 'glasses', ac: '#1a1a1a',
    good: [['Pesqué un pez enorme en el lago. Bueno, mediano. Vale, pequeño.', 'agua'],
      ['Bailé en la boda de mi prima y hasta el cura aplaudió.', 'fiesta'],
      ['Monté el mueble de la tele y no sobró ni un tornillo. Histórico.', 'casa']],
    bad: [['Empotré el coche contra el buzón. Todavía pago la multa.', 'coche'],
      ['Me quedé dormido en la función del cole de {herm}. Roncando.', 'cole'],
      ['Se murió el pez rojo y compré otro igual. {herm} lo notó.', 'agua']] },
  { id: 'herm', name: 'Hermana', col: '#FFD166', shape: 'tall', acc: 'bow', ac: '#FF5C7A',
    good: [['Gané la feria de ciencias con un volcán de bicarbonato.', 'cole'],
      ['En la playa {perro} se comió un bocadillo entero. Con papel y todo.', 'sol'],
      ['Fiesta de pijamas con mis amigas hasta las cuatro de la mañana.', 'noche']],
    bad: [['Me caí en mitad de la función de ballet. Todo el cole se rió.', 'cole'],
      ['Suspendí mates y escondí las notas debajo del colchón.', 'casa'],
      ['Mi mejor amiga se mudó lejos. Ya no me escribe.', 'lluvia']] },
  { id: 'abu', name: 'Abuelo', col: '#C9B8A8', shape: 'blob', acc: 'beret', ac: '#3B4A6B', mous: true,
    good: [['Le enseñé a {herm} a jugar al mus. Ahora me gana siempre.', 'casa'],
      ['Mi huerto dio el tomate más gordo del pueblo. Salí en el periódico.', 'sol'],
      ['Bailé con la abuela en las fiestas del 72. Qué guapa iba.', 'fiesta']],
    bad: [['El entierro de la abuela. No paró de llover.', 'lluvia'],
      ['Me perdí volviendo del mercado. Me trajo a casa la policía.', 'noche'],
      ['Me resbalé en la bañera y me rompí la cadera. Qué vergüenza.', 'hospital']] },
  { id: 'perro', name: 'Bartolo', col: '#B0703C', shape: 'dog',
    good: [['Pelota. Pelota. ¡PELOTA! El mejor día de mi vida.', 'sol'],
      ['{papa} dejó el filete en la mesa. Ya no está. No sé nada.', 'casa'],
      ['Siesta al sol en el sofá. Nadie me riñó.', 'sol']],
    bad: [['Veterinario. Termómetro. No quiero hablar de ello.', 'hospital'],
      ['Me comí un calcetín. Luego lo devolví. En la alfombra nueva.', 'casa'],
      ['Petardos en Nochevieja. Pasé la noche temblando bajo la cama.', 'noche']] },
  { id: 'prima', name: 'Prima Vero', col: '#53D8C3', shape: 'tall', acc: 'phones', ac: '#2E2340',
    good: [['{mama} me dejó su vestido para la graduación. Iba ideal.', 'fiesta'],
      ['Acampamos en el jardín y vimos una estrella fugaz.', 'noche'],
      ['Hice croquetas con {abu}. Las mejores del mundo.', 'casa']],
    bad: [['Mi novio me dejó por mensaje. En mi cumpleaños.', 'lluvia'],
      ['Rompí el jarrón de {mama} y culpé a {perro}. Perdón, Bartolo.', 'casa'],
      ['Me pilló una tormenta en la moto y acabé en urgencias.', 'hospital']] },
];
const FAKE = [
  { name: 'Tío Salchicha', col: '#E9785A', shape: 'long', acc: 'hat', ac: '#2E2340' },
  { name: 'Señora Paraguas', col: '#9C7BFF', shape: 'blob', acc: 'umbrella', ac: '#FF5C7A' },
  { name: 'Primo Bigotín', col: '#F2C14E', shape: 'wide', acc: 'none', mous: true },
  { name: 'Doña Gelatina', col: '#5FE0B0', shape: 'blob', acc: 'bow', ac: '#FFB23E' },
  { name: 'Tía Confeti', col: '#FF6FD8', shape: 'tall', acc: 'party', ac: '#B6E36A' },
  { name: 'Sargento Tostada', col: '#D9A066', shape: 'wide', acc: 'cap', ac: '#4B6B3B' },
  { name: 'Cuñado Pingüino', col: '#4A5A80', shape: 'tall', acc: 'tie', ac: '#FFB23E' },
  { name: 'Profe Burbuja', col: '#8FD3FF', shape: 'blob', acc: 'glasses', ac: '#1a1a1a' },
  { name: 'Abuela Nube', col: '#E6E6F0', shape: 'wide', acc: 'bun', ac: '#9a9aa8' },
  { name: 'Hermanito Globo', col: '#FF7A5C', shape: 'blob', acc: 'antenna', ac: '#FFB23E' },
  { name: 'Mago Pepino', col: '#7CC96A', shape: 'long', acc: 'wizard', ac: '#6FA8FF' },
  { name: 'Vecino Tornillo', col: '#A8A8B8', shape: 'tall', acc: 'cap', ac: '#FF5C7A' },
];
const SILLY = [
  ['¿Os acordáis de cuando {R} y yo montamos en delfín por la autopista? ¡Qué risas!', 'agua'],
  ['El cumple en que llovieron caramelos del techo. ¡El mejor día de la historia!', 'fiesta'],
  ['{R} me regaló un sombrero que canta. ¡Todavía se sabe tres canciones!', 'fiesta'],
  ['Fuimos a la luna en la furgoneta de {R}. Volvimos a tiempo para cenar.', 'luna'],
  ['Ganamos el concurso de baile del barrio. El premio era una vaca. ¡Se llama Lola!', 'fiesta'],
  ['Guerra de almohadas de tres días. Nadie se hizo daño. ¡Todos ganamos!', 'casa'],
  ['{R} y yo inventamos un deporte con cucharas. Somos campeones del mundo.', 'sol'],
  ['Hicimos una tarta de siete pisos y nos la comimos en un minuto. ¡Ñam!', 'fiesta'],
];
const NICE = [
  ['Aquella excursión al río con {R}. Hacía un sol precioso.', 'agua'],
  ['Navidad del año pasado. Yo traje los turrones, ¿os acordáis?', 'casa'],
  ['{R} me enseñó a hacer tortilla. Me salió perfecta a la primera.', 'casa'],
  ['Las cartas de los domingos. Siempre ganaba yo, ja, ja.', 'casa'],
  ['Fuimos al cine y a {R} le salió refresco por la nariz de la risa.', 'noche'],
  ['La boda de los primos. Bailamos hasta que cerraron.', 'fiesta'],
  ['El verano que me quedé a dormir aquí. Todo fue perfecto.', 'sol'],
  ['{R} y yo vimos las estrellas desde el tejado. Qué paz.', 'noche'],
];
const CLUE_REAL = [
  ['Juraría que antes de hoy nunca había visto a {X}. ¿O sí?', 'casa'],
  ['Con {X} todo fueron risas. Siempre. Nunca un mal día. Qué raro, ¿no?', 'fiesta'],
  ['¿{X}? No sale en ninguna foto del álbum familiar.', 'casa'],
];
const CLUE_FAKE = [
  ['¡{X} y yo somos uña y carne desde siempre! ¡Todo risas!', 'fiesta'],
  ['¡{X} es de la familia de toda la vida! ¡Le queremos muchísimo!', 'sol'],
];
const ROUNDS = [
  { n: 5, f: 2, time: 55, spawn: 7 }, { n: 6, f: 2, time: 55, spawn: 6 }, { n: 6, f: 3, time: 60, spawn: 5.5 },
  { n: 7, f: 3, time: 65, spawn: 5 }, { n: 8, f: 4, time: 70, spawn: 4.5 },
];
const MAXCH = 10;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = G.randi(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let S;
function newGame() {
  S = { round: 0, score: 0, alive: REAL.map(r => r.id), fakeOrder: shuffle(FAKE), fk: 0, phase: 'menu',
    st: { hit: 0, saved: 0, kill: 0, miss: 0 }, chars: [], splats: [], sel: null, aim: { x: 270, y: 300 } };
  intro();
}
function intro() {
  const b = G.best('quien-es-real');
  G.screen({ sub: 'Prototipo 04', title: '¿Quién Es Real?',
    html: `<p>Unos parásitos se han colado en casa. Implantan recuerdos falsos y se hacen pasar por familia. Descubre quién sobra antes de que se multipliquen.</p>
    <ul><li>Toca a cada personaje para ver sus recuerdos.</li><li>Márcalo como <b>REAL</b> o <b>PARÁSITO</b> y pulsa <b>Disparar</b>.</li>
    <li>Si se acaba el tiempo, aparecen más parásitos.</li><li>Teclado: ←/→ elegir, ↑/Espacio otro recuerdo, R / P marcar, Enter disparar.</li></ul>
    ${b ? `<p>Récord: <b>${b}</b></p>` : ''}`,
    button: 'Empezar', onClick: () => startRound(0) });
}

function fill(t, self, x) {
  const reals = S.chars.filter(c => !c.fake && !c.dead && c !== self).map(c => c.def.name);
  return t.replace(/\{R\}/g, () => reals.length ? G.pick(reals) : 'Mamá')
    .replace(/\{X\}/g, x || '???').replace(/\{(\w+)\}/g, (m, k) => N[k] || m);
}
function mkChar(def, fake) {
  return { def, fake, mems: [], mark: null, seen: new Set(), x: G.rand(80, 460), y: 700, tx: 270, ty: 400,
    ph: G.rand(0, 9), dead: false, gone: false, reveal: 0, pop: 0 };
}
function nextFakeDef() {
  const d = S.fakeOrder[S.fk % S.fakeOrder.length];
  const lap = Math.floor(S.fk / S.fakeOrder.length);
  S.fk++;
  return lap ? Object.assign({}, d, { name: d.name + ' ' + 'II III IV'.split(' ')[Math.min(lap - 1, 2)] }) : d;
}
function fakeMems(c, r) {
  const m = r < 2 ? 2 : 3;
  const pool = r < 2 ? SILLY : r === 2 ? SILLY.concat(NICE) : NICE;
  const list = shuffle(pool).slice(0, m).map(([t, s]) => ({ t: fill(t, c), s }));
  const others = S.chars.filter(o => o.fake && o !== c && !o.gone);
  if (m === 3 && others.length && Math.random() < 0.45) {
    const [t, s] = G.pick(CLUE_FAKE); list[2] = { t: fill(t, c, G.pick(others).def.name), s };
  }
  c.mems = list;
}
function realMems(c, r) {
  const d = c.def, goods = shuffle(d.good);
  const bad = G.pick(d.bad);
  const list = [{ t: fill(bad[0], c), s: bad[1], bad: 1 }];
  list.push({ t: fill(goods[0][0], c), s: goods[0][1] });
  if (r >= 2) list.push({ t: fill(goods[1][0], c), s: goods[1][1] });
  const fakes = S.chars.filter(o => o.fake);
  if (r >= 1 && fakes.length && Math.random() < 0.5) {
    const [t, s] = G.pick(CLUE_REAL); list[list.length - 1] = { t: fill(t, c, G.pick(fakes).def.name), s };
  }
  c.mems = shuffle(list);
}

function startRound(r) {
  const R = ROUNDS[r];
  S.round = r; S.phase = 'play'; S.timer = R.time; S.spawnT = 0; S.sel = null; S.splats = []; S.guilt = 0;
  S.rs = { hit: 0, saved: 0, kill: 0, miss: 0, bonus: 0 };
  const reals = shuffle(S.alive).slice(0, R.n - R.f).map(id => mkChar(REAL.find(x => x.id === id), false));
  const fakes = []; for (let i = 0; i < R.f; i++) fakes.push(mkChar(nextFakeDef(), true));
  S.chars = shuffle(reals.concat(fakes));
  fakes.forEach(c => fakeMems(c, r));
  reals.forEach(c => realMems(c, r));
  layout(true);
  G.beep(520, 0.1, 'triangle', 0.05, 200);
}
function present() { return S.chars.filter(c => !c.gone && !c.dead); }
function layout(snap) {
  const cs = S.chars.filter(c => !c.gone);
  const back = Math.ceil(cs.length / 2);
  cs.forEach((c, i) => {
    const row = i < back ? 0 : 1, k = row ? cs.length - back : back, j = row ? i - back : i;
    const sp = Math.min(96, 470 / k);
    c.tx = 270 + (j - (k - 1) / 2) * sp + (row ? 0 : (k > 1 ? 0 : 0));
    c.ty = row ? 548 : 400;
    if (snap) { c.x = c.tx; c.y = c.ty + 160; }
  });
}
function spawnFake() {
  if (present().length >= MAXCH) return lose();
  const c = mkChar(nextFakeDef(), true);
  c.x = 460; c.y = 250;
  S.chars.push(c); fakeMems(c, S.round); layout(false);
  G.burst(460, 220, C.lime, 24, 220, 6); G.shake(6, 0.3);
  G.beep(300, 0.25, 'sawtooth', 0.05, 500);
  G.float('¡Hola, familia!', 400, 290, C.lime, 22);
}
function lose() {
  S.phase = 'over';
  const b = G.best('quien-es-real', S.score);
  G.shake(16, 0.6); G.beep(160, 0.6, 'sawtooth', 0.08, -120);
  setTimeout(() => G.screen({ sub: 'Ronda ' + (S.round + 1) + '/5', title: '¡Casa invadida!', big: S.score + ' pts',
    html: `<p>Los parásitos se multiplicaron hasta llenar el salón. Ya nadie sabe quién es quién.</p><p>Récord: <b>${b}</b></p>`,
    button: 'Otra vez', onClick: newGame }), 700);
}

function select(c) {
  if (!c) return;
  S.sel = c; S.mi = 0;
  const unseen = c.mems.findIndex((m, i) => !c.seen.has(i)); if (unseen >= 0) S.mi = unseen;
  c.seen.add(S.mi); G.beep(700, 0.05, 'triangle', 0.04);
}
function nextMem() {
  if (!S.sel) return;
  S.mi = (S.mi + 1) % S.sel.mems.length; S.sel.seen.add(S.mi); G.beep(820, 0.04, 'triangle', 0.035);
}
function mark(m) {
  if (!S.sel) return;
  S.sel.mark = m;
  G.beep(m === 'real' ? 880 : 330, 0.08, m === 'real' ? 'sine' : 'square', 0.05);
  G.burst(S.sel.x, S.sel.y - 60, m === 'real' ? C.teal : C.pink, 8, 150, 4);
  // salta al siguiente sin marcar
  const nx = present().find(c => !c.mark); if (nx) select(nx);
}
function canShoot() { return S.phase === 'play' && present().every(c => c.mark); }
function shoot() {
  if (!canShoot()) return;
  S.phase = 'shoot'; S.sel = null; S.endT = 0; S.cur = null;
  S.rs.bonus = Math.max(0, Math.ceil(S.timer)) * 2;
  const ps = present().sort((a, b) => a.x - b.x);
  S.q = ps.filter(c => c.mark === 'fake').map(c => ({ c, t: 'shoot' }))
    .concat(ps.filter(c => c.mark === 'real' && c.fake).map(c => ({ c, t: 'reveal' })));
  S.spared = ps.filter(c => c.mark === 'real' && !c.fake);
  G.beep(200, 0.2, 'square', 0.06, 300);
}
function act(e) {
  const c = e.c;
  if (e.t === 'shoot') {
    G.beep(120, 0.15, 'square', 0.09, -60); G.shake(8, 0.2);
    if (c.fake) {
      c.gone = true; S.rs.hit++;
      G.burst(c.x, c.y - 40, C.lime, 36, 380, 8); G.burst(c.x, c.y - 40, '#7CFFB2', 16, 200, 5);
      S.splats.push({ x: c.x, y: c.y, r: G.rand(34, 46), ph: G.rand(0, 9) });
      G.float('+150 ¡Plof!', c.x, c.y - 110, C.lime, 26);
      G.beep(90, 0.3, 'sawtooth', 0.05, -40);
    } else {
      c.dead = true; S.rs.kill++; S.guilt = 2.4; S.guiltName = c.def.name;
      S.alive = S.alive.filter(id => id !== c.def.id);
      G.shake(18, 0.6); G.burst(c.x, c.y - 40, '#d33', 20, 200, 5);
      G.float('-400', c.x, c.y - 110, C.pink, 32);
      [440, 392, 349, 262].forEach((f, i) => setTimeout(() => G.beep(f, 0.35, 'triangle', 0.06), i * 280));
    }
  } else {
    c.reveal = 0.01; S.rs.miss++;
    G.float('-200 ¡Je, je!', c.x, c.y - 110, C.pink, 24);
    G.beep(600, 0.3, 'sawtooth', 0.05, -400); G.shake(6, 0.3);
    G.burst(c.x, c.y - 40, C.pink, 18, 220, 5);
  }
}
function endRound() {
  const rs = S.rs; rs.saved = S.spared.length;
  const pts = rs.hit * 150 + rs.saved * 100 - rs.kill * 400 - rs.miss * 200 + rs.bonus;
  S.score = Math.max(0, S.score + pts);
  for (const k of ['hit', 'saved', 'kill', 'miss']) S.st[k] += rs[k];
  const perfect = !rs.kill && !rs.miss;
  const lines = `<ul><li>Parásitos reventados: <b>${rs.hit}</b> (+${rs.hit * 150})</li><li>Familia a salvo: <b>${rs.saved}</b> (+${rs.saved * 100})</li>
    ${rs.kill ? `<li>Familia disparada: <b>${rs.kill}</b> (−${rs.kill * 400})</li>` : ''}${rs.miss ? `<li>Parásitos colados: <b>${rs.miss}</b> (−${rs.miss * 200})</li>` : ''}
    <li>Tiempo sobrante: +${rs.bonus}</li></ul>`;
  const hints = ['<p style="color:#FFB23E"><b>Pista:</b> los parásitos solo saben fingir recuerdos bonitos...</p>',
    '<p style="color:#FFB23E"><b>Pista:</b> algunos recuerdos hablan de otros. ¿Quién dice la verdad?</p>',
    '<p style="color:#FFB23E">Cada vez son más listos: ya no todo es absurdo. Lee con calma, pero no demasiada.</p>',
    '<p style="color:#FFB23E">Última ronda. La casa está llena.</p>'];
  if (S.round >= 4) {
    S.phase = 'over';
    const b = G.best('quien-es-real', S.score);
    const t = S.st.kill === 0 && S.st.miss === 0 ? 'Familia intacta' : S.st.kill === 0 ? 'Casi limpia' : S.alive.length <= 3 ? 'Cena muy silenciosa' : 'Hogar, raro hogar';
    G.screen({ sub: 'Fin de la partida', title: t, big: S.score + ' pts',
      html: `${lines}<p>Total: ${S.st.hit} parásitos cazados · ${S.st.kill} familiares disparados · ${S.st.miss} colados.</p><p>Récord: <b>${b}</b></p>`,
      button: 'Jugar otra vez', onClick: newGame });
  } else {
    S.phase = 'between';
    G.screen({ sub: 'Ronda ' + (S.round + 1) + '/5', title: perfect ? '¡Salón limpio!' : rs.kill ? 'Eso ha dolido...' : 'Alguien se ha colado', big: (pts >= 0 ? '+' : '') + pts,
      html: lines + hints[S.round], button: 'Siguiente ronda', onClick: () => startRound(S.round + 1) });
  }
}

// ---------- Actualización ----------
function hitChar(px, py) {
  const cs = present().slice().sort((a, b) => b.y - a.y);
  return cs.find(c => Math.abs(px - c.x) < 38 && py < c.y + 8 && py > c.y - 105);
}
function update(dt) {
  for (const c of S.chars) { c.x = G.lerp(c.x, c.tx, Math.min(1, dt * 5)); c.y = G.lerp(c.y, c.ty, Math.min(1, dt * 5)); }
  if (S.guilt > 0) S.guilt -= dt;
  if (S.phase === 'play') {
    S.timer -= dt;
    if (S.timer <= 0) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) { S.spawnT = ROUNDS[S.round].spawn; spawnFake(); if (S.phase !== 'play') return; }
    }
    const p = G.pointer;
    if (p.pressed && p.sy > 118 && p.sy < 575) { const c = hitChar(p.sx, p.sy); if (c) select(c); }
    const ps = present().sort((a, b) => a.x - b.x || a.y - b.y);
    if ((G.keyPressed('ArrowRight') || G.keyPressed('ArrowLeft')) && ps.length) {
      const i = ps.indexOf(S.sel), d = G.keyPressed('ArrowRight') ? 1 : -1;
      select(ps[(i < 0 ? 0 : i + d + ps.length) % ps.length]);
    }
    if (G.keyPressed('ArrowUp') || G.keyPressed(' ')) nextMem();
    if (G.keyPressed('r') || G.keyPressed('R')) mark('real');
    if (G.keyPressed('p') || G.keyPressed('P')) mark('fake');
    if (G.keyPressed('Enter')) shoot();
  } else if (S.phase === 'shoot') {
    if (!S.cur) {
      if (S.q.length) { S.cur = S.q.shift(); S.qT = 0; S.done = false; }
      else { S.endT += dt; if (S.endT > (S.guilt > 0 ? 2.2 : 1)) endRound(); }
    } else {
      const c = S.cur.c; S.qT += dt;
      S.aim.x = G.lerp(S.aim.x, c.x, Math.min(1, dt * 10)); S.aim.y = G.lerp(S.aim.y, c.y - 45, Math.min(1, dt * 10));
      if (S.qT > 0.45 && !S.done) { S.done = true; act(S.cur); }
      if (c.reveal) { c.reveal += dt; if (c.reveal > 1.1) { c.tx = 600; c.ty = 300; } if (c.reveal > 1.6) c.gone = true; }
      if (S.qT > (S.cur.t === 'shoot' && !c.fake ? 2.2 : S.cur.t === 'reveal' ? 1.7 : 0.8)) S.cur = null;
    }
  }
}

// ---------- Dibujo ----------
function blobPath(cx, cy, rx, ry, ph) {
  ctx.beginPath();
  for (let i = 0; i <= 28; i++) {
    const a = i / 28 * Math.PI * 2, w = 1 + Math.sin(a * 3 + G.t * 2 + ph) * 0.035;
    const px = cx + Math.cos(a) * rx * w, py = cy + Math.sin(a) * ry * w * (a > 0 && a < Math.PI ? 1 : 1.05);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function eyes(x, y, gap, r, c) {
  const blink = (Math.sin(G.t * 1.3 + c.ph * 3) > 0.985);
  for (const s of [-1, 1]) {
    const ex = x + s * gap;
