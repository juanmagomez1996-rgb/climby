<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Una Vida en 20 Minutos</title></head><body>
<script src="proto.js"></script>
<script>
// Una Vida en 20 Minutos: una vida entera de Ramón en ~3-4 minutos de recreativa.
const G = Proto.create({ onRestart() { reset(); G.hideScreen(); } });
const C = G.C, ctx = G.ctx, { rand, randi, pick, clamp, lerp, dist } = G;
const S = { x: 30, y: 140, w: 480, h: 560 };
const CX = S.x + S.w / 2, SB = S.y + S.h, SR = S.x + S.w, GY = SB - 90, RX = CX - 50;
const P = G.pointer, TAU = Math.PI * 2, YPX = 220;
const KEYS = ['s', 'd', 'f', 'r'], NAMES = ['Salud', 'Dinero', 'Felicidad', 'Relaciones'], COLS = [C.pink, C.gold, C.lime, C.blue];
const BARY = [752, 796, 840, 884];
const STAGES = [
  { from: 0, name: 'INFANCIA', sky: ['#7ec8ff', '#c8ecff'], ground: '#6ac46a', shirt: C.lime },
  { from: 13, name: 'ADOLESCENCIA', sky: ['#ff8aa8', '#ffd0a0'], ground: '#7a8a6a', shirt: C.pink },
  { from: 20, name: 'VIDA ADULTA', sky: ['#4a5a8a', '#8a9ac0'], ground: '#5a5a6a', shirt: C.blue },
  { from: 45, name: 'MADUREZ', sky: ['#8a6ab0', '#e0b0c0'], ground: '#6a8a5a', shirt: '#9a6ae0' },
  { from: 65, name: 'VEJEZ', sky: ['#3a2a5a', '#ff9a5a'], ground: '#8a6a4a', shirt: '#c9b48a' },
];
const stageOf = a => { let k = 0; STAGES.forEach((s, i) => { if (a >= s.from) k = i; }); return k; };
const pn = t => t.replaceAll('{p}', st.partner || 'tu pareja');

// ---------- Decisiones (fx = [salud, dinero, felicidad, relaciones]) ----------
const EV = [
  { age: 6, q: 'Primer día de cole. ¿Con quién te sientas?', o: [
    { t: 'Con el niño raro que come pegamento', fx: [0, 0, 5, 10], tag: 'se sentó con el niño raro', later: { a: 26, t: 'El niño raro ahora es millonario. Te invita a su yate.', fx: [0, 15, 10, 5] } },
    { t: 'Solo, al fondo, junto a la ventana', fx: [0, 0, -3, -8], later: { a: 30, t: 'Sigues eligiendo la mesa del fondo. En todo.', fx: [0, 0, -5, -5] } }] },
  { age: 9, q: '¿Qué haces por las tardes?', o: [
    { t: 'Fútbol en el descampado', fx: [10, 0, 5, 5], tag: 'jugó al fútbol en el descampado', risk: [0.25, [-15, 0, -5, 0], 'Te rompes la pierna. Vas escayolado a tu cumple.', 'una patada mal dada'] },
    { t: 'Clases de piano', fx: [0, -3, 3, 0], tag: 'aprendió piano', later: { a: 50, t: 'Tocas el piano en la boda de tu sobrina. Llora todo el mundo.', fx: [0, 0, 12, 10] } },
    { t: 'Videojuegos hasta las tantas', fx: [-5, 0, 10, 0], later: { a: 35, t: 'Sigues siendo imbatible al Blorptris. No sirve de nada.', fx: [0, 0, 5, 0] } }] },
  { age: 15, q: 'Mañana hay examen. ¿Estudias o te vas de fiesta?', o: [
    { t: 'Estudio', fx: [0, 0, -5, -3], tag: 'estudió la noche del examen', later: { a: 30, t: 'Aquel examen te abrió una puerta. Una pequeña.', fx: [0, 20, 0, 0] } },
    { t: 'Fiesta', fx: [-5, 0, 10, 10], tag: 'se fue de fiesta la noche del examen', later: { a: 45, t: 'Aquella fiesta sigue siendo tu mejor recuerdo.', fx: [0, 0, 8, 0] } }] },
  { age: 17, q: '¿Le pides salir a Lucía?', o: [
    { t: 'Sí, con una flor del parque', tag: 'le pidió salir a Lucía', f() {
      if (Math.random() < 0.4 + st.st.r / 200) { st.flags.pareja = 1; st.partner = 'Lucía'; apply([0, 0, 15, 15]); return 'Lucía dice que sí. Te tiembla todo.'; }
      apply([0, 0, -15, -5]); st.later.push({ a: 60, t: 'Ves a Lucía en el súper. Te saluda con cariño.', fx: [0, 0, 6, 0] }); return 'Te dice que no. Delante de todos.'; } },
    { t: 'Ni de broma', fx: [0, 0, -5, 0], tag: 'nunca le pidió salir a Lucía', later: { a: 62, t: 'Aún piensas en Lucía a veces.', fx: [0, 0, -10, 0] } }] },
  { age: 19, q: 'Se acaba el instituto. ¿Y ahora?', o: [
    { t: 'Universidad', fx: [0, -10, 0, 5], tag: 'fue a la universidad', later: { a: 28, t: 'El título por fin sirve para algo.', fx: [0, 25, 5, 0] } },
    { t: 'Aceptas el trabajo de alfombras', fx: [-3, 15, -3, 0], tag: 'aceptó el trabajo de alfombras', later: { a: 45, t: 'Eres el rey de las alfombras del barrio.', fx: [0, 15, 5, 5] } },
    { t: 'Te vas a viajar sin un duro', fx: [0, -15, 15, 5], tag: 'se fue a viajar sin un duro' }] },
  { age: 24, q: 'Un perro te sigue hasta casa.', o: [
    { t: 'Te lo quedas. Se llama Tornillo.', fx: [3, -5, 10, 5], flag: 'perro', tag: 'adoptó a Tornillo', later: { a: 37, t: 'Tornillo se muere de viejo. Lo enterráis bajo el limonero.', fx: [0, 0, -15, 0], off: 'perro' } },
    { t: 'Lo devuelves a la calle', fx: [0, 0, -3, 0], later: { a: 40, t: 'Ves un perro igualito. Te mira raro.', fx: [0, 0, -5, 0] } }] },
  { age: 28, need: 'pareja', q: '{p} quiere casarse contigo.', o: [
    { t: '¡Sí, quiero!', fx: [0, -10, 15, 15], flag: 'casado', tag: 'se casó con {p}' },
    { t: 'Todavía no...', fx: [0, 0, -5, -15], f() { if (Math.random() < 0.5) { st.flags.pareja = 0; return pn('{p} se va. Se lleva la tostadora.'); } return pn('{p} espera. Pero lo apunta.'); } }] },
  { age: 28, not: 'pareja', q: 'Una app de citas te empareja con Marga.', o: [
    { t: 'Quedas con ella', tag: 'quedó con Marga', f() {
      if (Math.random() < 0.6) { st.flags.pareja = 1; st.partner = 'Marga'; apply([0, -3, 12, 15]); return 'Marga se ríe de tus chistes. De todos.'; }
      apply([0, -3, -8, 0]); return 'Marga va al baño y no vuelve.'; } },
    { t: 'Mejor solo', fx: [0, 0, -5, -8] }] },
  { age: 32, q: '¿Tener hijos?', o: [
    { t: 'Sí, una niña', fx: [-5, -20, 12, 10], flag: 'hija', tag: 'tuvo una hija', later: { a: 58, t: 'Tu hija te llama solo para hablar.', fx: [0, 0, 15, 10] } },
    { t: 'Mejor una planta', fx: [0, 0, 3, 0], tag: 'cuidó de una planta 23 años', flag: 'planta', later: { a: 55, t: 'La planta sigue viva. Es tu mayor logro.', fx: [0, 0, 5, 0] } }] },
  { age: 36, q: 'Tu jefe te ofrece un ascenso... a cambio de tus fines de semana.', o: [
    { t: 'Aceptas', fx: [-10, 25, -5, -15], tag: 'trabajó todos los fines de semana' },
    { t: 'Rechazas', fx: [0, -5, 5, 5] }] },
  { age: 41, q: 'Crisis de los 40.', o: [
    { t: 'Te compras una moto roja', fx: [0, -15, 15, 0], tag: 'se compró una moto roja', risk: [0.3, [-30, 0, -5, 0], 'Te la pegas con la moto. Tres meses en el hospital.', 'la moto roja'] },
    { t: 'Corres una maratón', fx: [15, 0, 5, 0], tag: 'corrió una maratón' },
    { t: 'Lo aceptas y ya', fx: [0, 0, -5, 5] }] },
  { age: 47, q: 'Tu cuñado te ofrece invertir en criptopatatas.', o: [
    { t: 'Meto todos mis ahorros', tag: 'lo metió todo en criptopatatas', f() {
      if (Math.random() < 0.45) { apply([0, 40, 10, 0]); return '¡Las criptopatatas se disparan! Eres rico.'; }
      apply([-5, -40, -10, 0]); st.lastHurt = 'el disgusto de las criptopatatas'; return 'Las criptopatatas eran patatas.'; } },
    { t: 'Ni un euro', fx: [0, 0, 0, -5], m: 'Tu cuñado deja de hablarte. Ganas algo.' }] },
  { age: 53, q: 'El médico dice: menos croquetas.', o: [
    { t: 'Le haces caso', fx: [12, 0, -5, 0] },
    { t: 'Una croqueta más no mata', fx: [-8, 0, 8, 0], tag: 'no renunció a las croquetas', later: { a: 64, t: 'Las croquetas pasan factura.', fx: [-25, 0, 0, 0], cause: 'las croquetas' } }] },
  { age: 63, q: '¿Te jubilas ya?', o: [
    { t: 'Sí, a mirar obras', fx: [5, -10, 10, 5], tag: 'miró obras con pasión' },
    { t: 'Sigo currando', fx: [-10, 15, -5, -5] }] },
  { age: 70, q: 'Hay baile en el centro de mayores.', o: [
    { t: '¡A bailar!', fx: [3, 0, 12, 10], tag: 'bailó un pasodoble a los 70', risk: [0.25, [-20, 0, 0, 0], 'Te rompes la cadera en un pasodoble.', 'un pasodoble'] },
    { t: 'Sofá y tele', fx: [-5, 0, -3, -5] }] },
  { age: 74, need: 'pareja', auto: { t: '{p} se va antes que tú. La casa suena distinta.', fx: [-5, 0, -20, -10], off: 'pareja' } },
  { age: 77, q: 'Un viejo amigo te escribe después de 40 años.', o: [
    { t: 'Le llamas', fx: [0, 0, 10, 15], tag: 'volvió a llamar a un viejo amigo' },
    { t: 'Mañana', fx: [0, 0, -8, -5], later: { a: 80, t: 'Tu amigo ha muerto. El mañana no llegó.', fx: [0, 0, -15, -5] } }] },
  { age: 84, q: '¿Qué haces con tus ahorros?', o: [
    { t: 'Repartirlos en vida', fx: [0, -30, 10, 15], tag: 'lo repartió todo en vida' },
    { t: 'Un crucero', fx: [0, -25, 15, 0], tag: 'se fue de crucero a los 84' },
    { t: 'Bajo el colchón', fx: [0, 0, -3, -3] }] },
];

// ---------- Estado ----------
let st;
function reset() {
  st = { age: 0, yt: 0, st: { s: 75, d: 15, f: 60, r: 50 }, flags: {}, partner: null, later: [], tags: [], done: new Set(),
    ev: null, beat: null, banners: [], dead: false, deathT: 0, shown: false, score: 0, lastBeat: 0, walk: 0, lastHurt: '', stage: 0, cause: '', sel: 0, flash: [0, 0, 0, 0], playing: true };
}
function banner(head, text, col = C.gold) { st.banners.push({ head, text: pn(text), t: 0, col }); }
function apply(fx, cause) {
  fx.forEach((v, i) => {
    if (!v) return;
    const dv = Math.round(v * rand(0.7, 1.3)) || Math.sign(v), k = KEYS[i];
    st.st[k] = clamp(st.st[k] + dv, 0, 100); st.flash[i] = 1;
    G.float((dv > 0 ? '+' : '') + dv, 508, BARY[i] + 4, COLS[i], 22);
    if (i === 0 && dv < 0 && cause) st.lastHurt = cause;
  });
  if (st.st.s <= 0) die();
}
function die(cause) {
  if (st.dead) return;
  st.dead = true; st.deathT = 0; st.ev = null; st.beat = null;
  st.cause = cause || (st.lastHurt ? 'por ' + st.lastHurt : 'por no cuidarse');
  G.shake(6, 0.4);
  [523, 440, 392, 262].forEach((f, i) => setTimeout(() => G.beep(f, 0.35, 'triangle', 0.06), i * 260));
}
const yearDur = () => st.age < 4 ? 0.8 : 2.1;

function yearTick() {
  st.age++;
  const s = st.st, a = st.age;
  if (a > 40) s.s -= 0.6; if (a > 60) s.s -= 1; if (s.f < 20) s.s -= 1;
  if (a >= 19 && a < 65) s.d += 0.7; else if (a >= 65) s.d -= 0.4;
  if (!st.flags.pareja && a > 30) s.r -= 0.4;
  KEYS.forEach(k => s[k] = clamp(s[k], 0, 100));
  st.score += (s.f + s.r + s.s * 0.5 + s.d * 0.3) / 10;
  G.beep(700, 0.03, 'square', 0.02);
  const sg = stageOf(a);
  if (sg !== st.stage) { st.stage = sg; banner('NUEVA ETAPA', STAGES[sg].name, C.teal); G.beep(523, 0.1); setTimeout(() => G.beep(784, 0.15), 100); }
  for (const L of st.later.filter(L => L.a === a)) { banner('CONSECUENCIA · ' + a + ' AÑOS', L.t, C.pink); apply(L.fx, L.cause); if (L.off) st.flags[L.off] = 0; }
  st.later = st.later.filter(L => L.a !== a);
  if (st.dead) return;
  if (s.s <= 0) return die();
  if (a >= 100 || (a >= 68 && Math.random() < (a - 66) * 0.012 + (100 - s.s) / 900)) return die(a >= 95 ? 'de viejísimo' : 'de viejo, en su cama');
  for (const e of EV) {
    if (st.done.has(e) || e.age > a) continue;
    st.done.add(e);
    if ((e.need && !st.flags[e.need]) || (e.not && st.flags[e.not])) continue;
    if (e.auto) { banner('A LOS ' + a + ' AÑOS', e.auto.t, C.pink); apply(e.auto.fx); st.flags[e.auto.off] = 0; continue; }
    st.beat = null; st.ev = { e, t: 0 }; st.sel = 0; G.beep(330, 0.12, 'triangle', 0.06); return;
  }
  const next = EV.find(e => !st.done.has(e));
  if (a >= 3 && a - st.lastBeat >= 3 && (!next || next.age > a + 2)) startBeat();
}
function choose(i, auto) {
  const e = st.ev.e, o = e.o[i]; st.ev = null;
  G.beep(880, 0.08); G.burst(CX, S.y + 280 + i * 108, C.gold, 18);
  if (auto) banner('LA VIDA DECIDE POR TI', o.t, C.dim);
  if (o.tag) st.tags.push({ a: st.age, t: pn(o.tag) });
  if (o.flag) st.flags[o.flag] = 1;
  if (o.later) st.later.push(o.later);
  if (o.fx) apply(o.fx, o.cause);
  if (o.m) banner('', o.m);
  if (o.f) { const r = o.f(); if (r) banner('', r); }
  if (o.risk && Math.random() < o.risk[0]) { banner('¡AY!', o.risk[2], C.pink); apply(o.risk[1], o.risk[3]); G.shake(12, 0.3); G.beep(120, 0.3, 'sawtooth', 0.07, -60); }
}

// ---------- Momentos de acción ----------
function startBeat() {
  const a = st.age, types = [];
  if (a < 20) types.push('pelota', 'pelota');
  if (a >= 18 && a < 66) types.push('monedas');
  if (a >= 8) types.push('corazones');
  if (a >= 13) types.push('equilibrio');
  if (a >= 60) types.push('equilibrio');
  const type = pick(types), b = { type, t: 0, dur: 3.4, objs: [], x: 0, v: 0, got: 0 };
  st.lastBeat = a;
  if (type === 'pelota') b.objs.push({ x: SR + 20, y: S.y + 200, vx: -190, vy: -120 });
  if (type === 'monedas') for (let i = 0; i < 4; i++) b.objs.push({ x: rand(S.x + 60, SR - 60), y: GY - 20, vy: -rand(380, 520), d: i * 0.35, live: 1 });
  if (type === 'corazones') for (let i = 0; i < 3; i++) b.objs.push({ x: rand(S.x + 60, SR - 60), y: GY + 20, d: i * 0.5, live: 1 });
  b.title = { pelota: '¡ATRAPA LA PELOTA!', monedas: '¡COGE LAS MONEDAS!', corazones: '¡TOCA LOS CORAZONES!', equilibrio: '¡MANTÉN EL EQUILIBRIO!' }[type];
  st.beat = b; G.beep(990, 0.06, 'square', 0.04);
}
function updateBeat(dt) {
  const b = st.beat; b.t += dt;
  const tapIn = P.pressed && G.inRect(P.x, P.y, S.x, S.y, S.w, S.h), sp = G.keyPressed(' ') || G.keyPressed('Enter');
  const end = () => { st.beat = null; };
  if (b.type === 'pelota') {
    const o = b.objs[0];
    if (!o.got) { o.x += o.vx * dt; o.vy += 150 * dt; o.y += o.vy * dt; }
    if (!o.got && ((tapIn && dist(P.x, P.y, o.x, o.y) < 60) || (sp && Math.abs(o.x - RX) < 80))) { o.got = 1; G.burst(o.x, o.y, C.gold, 18); G.float('¡La cogiste!', RX, GY - 200, C.lime); apply([2, 0, 5, 0]); G.beep(880, 0.1); }
    if (o.got) { o.x = RX + 30; o.y = GY - 90; if (b.t > b.dur) end(); }
    else if (o.x < S.x - 30) { G.float('Se te escapa', RX, GY - 200, C.dim); apply([0, 0, -3, 0]); end(); }
  } else if (b.type === 'monedas' || b.type === 'corazones') {
    const coin = b.type === 'monedas';
    for (const o of b.objs) {
      if (!o.live || b.t < o.d) continue;
      if (coin) { o.vy += 500 * dt; o.y += o.vy * dt; if (o.y > GY + 40) o.live = 0; } else o.y -= 150 * dt;
      if (!coin && o.y < S.y + 40) o.live = 0;
    }
    const live = b.objs.filter(o => o.live && b.t >= o.d);
    let hit = null;
    if (tapIn) hit = live.find(o => dist(P.x, P.y, o.x, o.y) < 55);
    if (!hit && sp && live.length) hit = live[0];
    if (hit) { hit.live = 0; b.got++; G.burst(hit.x, hit.y, coin ? C.gold : C.pink, 14); G.beep(coin ? 1200 : 660, 0.08, coin ? 'square' : 'triangle', 0.05); apply(coin ? [0, 3, 0, 0] : [0, 0, 1, 3]); }
    if (b.objs.every(o => !o.live)) { if (b.got === b.objs.length) G.float('¡Perfecto!', CX, S.y + 160, C.lime); end(); }
  } else if (b.type === 'equilibrio') {
    let push = 0;
    if (P.down && G.inRect(P.x, P.y, S.x, S.y, S.w, S.h)) push = P.x < CX ? -1 : 1;
    if (G.key('ArrowLeft')) push = -1; if (G.key('ArrowRight')) push = 1;
    const k = st.age > 60 ? 1.4 : 1;
    b.v += (b.x * 2.2 * k + rand(-2.5, 2.5) * k + push * 5) * dt; b.v *= 0.98; b.x += b.v * dt;
    if (Math.abs(b.x) >= 1) { G.float('¡Te caes de culo!', RX, GY - 200, C.pink); G.shake(10); G.beep(140, 0.25, 'sawtooth', 0.07, -60); apply([-8, 0, -3, 0], 'una caída tonta'); end(); }
    else if (b.t > b.dur) { G.float('¡Equilibrio perfecto!', RX, GY - 200, C.lime); apply([6, 0, 2, 0]); end(); }
  }
}

// ---------- Bucle ----------
function update(dt) {
  if (!st.playing) return;
  for (let i = 0; i < 4; i++) st.flash[i] = Math.max(0, st.flash[i] - dt * 2);
  if (st.dead) {
    st.deathT += dt;
    if (st.deathT > 3.4 && !st.shown) { st.shown = true; results(); }
    return;
  }
  if (st.banners.length && !st.ev && !st.beat) { st.banners[0].t += dt; if (st.banners[0].t > 3) st.banners.shift(); }
  if (st.ev) {
    st.ev.t += dt;
    const n = st.ev.e.o.length;
    for (let i = 0; i < n; i++) if (G.keyPressed(String(i + 1))) return choose(i);
    if (G.keyPressed('ArrowDown')) st.sel = (st.sel + 1) % n;
    if (G.keyPressed('ArrowUp')) st.sel = (st.sel + n - 1) % n;
    if (G.keyPressed(' ') || G.keyPressed('Enter')) return choose(st.sel);
    if (P.pressed) for (let i = 0; i < n; i++) { const r = cardRect(i, n); if (G.inRect(P.x, P.y, r.x, r.y, r.w, r.h)) return choose(i); }
    if (st.ev.t > 10) choose(randi(0, n - 1), true);
    return;
  }
  st.walk += dt;
  if (st.beat) updateBeat(dt);
  st.yt += dt / yearDur();
  if (st.yt >= 1) { st.yt -= 1; yearTick(); }
}
function results() {
  const s = st.st, a = st.age;
  const best = [['f', 'Fue feliz, que no es poco.'], ['d', 'Tenía mucho dinero. Ahora lo tiene otro.'], ['r', 'Nunca comió solo.'], ['s', 'Murió sanísimo, curiosamente.']].sort((x, y) => s[y[0]] - s[x[0]])[0][1];
  let low = '';
  if (s.f < 25) low = 'No sonreía ni en las fotos.';
  else if (s.r < 25) low = st.flags.planta ? 'A su entierro fue su planta.' : 'A su entierro fueron cuatro, pero puntuales.';
  else if (s.d < 12) low = 'Debe tres euros a medio barrio.';
  else if (a < 40) low = 'Se fue demasiado pronto, con la tele encendida.';
  else if (st.flags.hija) low = 'Su hija aún guarda su jersey feo.';
  else if (st.partner && st.flags.pareja) low = pn('{p} dice que roncaba, y que lo echa de menos.');
  else low = 'Hizo lo que pudo con lo que le tocó.';
  const score = Math.round(st.score), prev = G.best('vida20') || 0, rec = G.best('vida20', score);
  const tags = st.tags.length > 4 ? [0, 1, 2, 3].map(i => st.tags[Math.round(i * (st.tags.length - 1) / 3)]) : st.tags;
  const moments = tags.length ? `<ul>${tags.map(t => `<li>A los ${t.a}, ${t.t}.</li>`).join('')}</ul>` : '<p>No tomó ninguna decisión memorable.</p>';
  G.screen({ sub: 'Sales del juego', title: `Ramón (0 – ${a})`, big: score + ' pts',
    html: `<p><i>«Aquí yace Ramón. ${best} ${low}»</i></p><p>Murió a los ${a} años, ${st.cause}.</p>${moments}
      <p style="color:${C.dim}">Salud ${Math.round(s.s)} · Dinero ${Math.round(s.d)} · Felicidad ${Math.round(s.f)} · Relaciones ${Math.round(s.r)}</p>
      <p>${score > prev ? '<b style="color:' + C.lime + '">¡Mejor vida hasta ahora!</b> ' : ''}Récord: <b>${rec}</b></p>`,
    button: 'Vivir otra vez', onClick: reset });
}

// ---------- Dibujo ----------

function person(x, gy, age, o = {}) {

function ramon(x, gy, extra = {}) {

function family() {
