<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Parque Interno</title></head><body>
<script src="proto.js"></script>
<script>
// Parque Interno — mini tycoon dentro del cuerpo de Don Anselmo.
const G = Proto.create({ onRestart() { newGame(); } });
const C = G.C, ctx = G.ctx, W = G.W;
const DAY = 20, DAYS = 10;

const ZD = [
  { id: 'cerebro', name: 'Cerebro', x: 270, y: 196, r: 42, col: '#FF9EC4', spec: 'cine' },
  { id: 'pulmones', name: 'Pulmones', x: 180, y: 392, r: 50, col: '#FF8FA3', spec: 'tobogan' },
  { id: 'corazon', name: 'Corazón', x: 358, y: 404, r: 42, col: '#E8364F', spec: 'montana' },
  { id: 'estomago', name: 'Estómago', x: 190, y: 530, r: 48, col: '#F2A65A', spec: 'noria' },
  { id: 'higado', name: 'Hígado', x: 360, y: 528, r: 44, col: '#A0523E', spec: 'bar' },
  { id: 'intestinos', name: 'Intestinos', x: 270, y: 648, r: 54, col: '#E89A8A', spec: 'tren' },
];
const ENT = { id: 'ent', x: 270, y: 286 };
const NODE = { ent: ENT }; ZD.forEach(z => NODE[z.id] = z);
const EDGES = [['ent', 'cerebro'], ['ent', 'pulmones'], ['ent', 'corazon'], ['pulmones', 'corazon'], ['pulmones', 'estomago'],
  ['corazon', 'higado'], ['corazon', 'estomago'], ['estomago', 'higado'], ['estomago', 'intestinos'], ['higado', 'intestinos']]
  .map(([a, b], i) => {
    const A = NODE[a], B = NODE[b], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, len = G.dist(A.x, A.y, B.x, B.y);
    const nx = -(B.y - A.y) / len, ny = (B.x - A.x) / len, k = (i % 2 ? 1 : -1) * Math.min(26, len * 0.15);
    return { a, b, cx: mx + nx * k, cy: my + ny * k, len: len * 1.08 };
  });
const NB = {}; for (const e of EDGES) { (NB[e.a] = NB[e.a] || []).push(e.b); (NB[e.b] = NB[e.b] || []).push(e.a); }
const edgeOf = (u, v) => EDGES.find(e => (e.a === u && e.b === v) || (e.a === v && e.b === u));
function pointOn(u, v, t) {
  const e = edgeOf(u, v); if (e.a !== u) t = 1 - t;
  const A = NODE[e.a], B = NODE[e.b], m = 1 - t;
  return { x: m * m * A.x + 2 * m * t * e.cx + t * t * B.x, y: m * m * A.y + 2 * m * t * e.cy + t * t * B.y };
}
const RIDES = {
  cine: { name: 'Cine Neuronal', short: 'Cine', cost: 260, price: 22, fun: 26, stress: 1.4 },
  tobogan: { name: 'Tobogán Bronquial', short: 'Tobogán', cost: 200, price: 16, fun: 22, stress: 1.2 },
  montana: { name: 'Montaña Rusa Aórtica', short: 'Montaña', cost: 320, price: 28, fun: 32, stress: 1.8 },
  noria: { name: 'Noria Estomacal', short: 'Noria', cost: 230, price: 18, fun: 22, stress: 1.3 },
  bar: { name: 'Bar de Bilis', short: 'Bar', cost: 150, price: 12, fun: 14, stress: 1.0 },
  tren: { name: 'Tren Intestinal', short: 'Tren', cost: 190, price: 15, fun: 20, stress: 1.1 },
  chuches: { name: 'Puesto de Chuches', short: 'Chuches', cost: 90, price: 8, fun: 9, stress: 0.5 },
  enfermeria: { name: 'Enfermería', short: 'Enfermería', cost: 140, price: 0, fun: 4, stress: -1.2 },
};
const EVENTS = {
  gripe: { name: '¡GRIPE!', tip: 'Aplasta los virus', dur: 18 },
  indig: { name: '¡INDIGESTIÓN!', tip: 'Estómago inundado', dur: 16 },
  fiebre: { name: '¡FIEBRE!', tip: 'Todo se avería', dur: 22 },
};
const FEED = 60, ANTI = 50, CLOTH = 40, REPAIR = 40, UPKEEP = 6;
const PILL = [['#FF5C7A', '#F2E9D8'], ['#6FA8FF', '#FFB23E'], ['#53D8C3', '#F2E9D8'], ['#B6E36A', '#FF5C7A'], ['#FFB23E', '#6FA8FF']];

let S;
function newGame() {
  S = { phase: 'menu', time: 0, day: 1, money: 600, happySum: 0, served: 0, sad: 0, rep: 0.6, temp: 36.8, hunger: 20,
    z: {}, vis: [], virus: [], sel: 'corazon', spawnT: 1, ev: null, evT: 0, nextEv: 34, lastEv: null, breakT: 3, evCount: 0 };
  ZD.forEach(z => S.z[z.id] = { health: 100, rides: [], closed: false, flood: 0 });
  intro();
}
function intro() {
  const b = G.best('parque-interno');
  G.screen({ sub: 'Prototipo 05', title: 'Parque Interno',
    html: `<p>Has abierto un parque de atracciones dentro de Don Anselmo, un señor muy enfermo. Construye, cobra entradas y que no se te muera el anfitrión. Aguanta ${DAYS} días.</p>
    <ul><li>Toca un órgano y elige qué construir abajo.</li><li>Demasiadas atracciones en un órgano lo enferman. La Enfermería lo cura.</li>
    <li>Aliméntale, bájale la fiebre y aplasta los virus tocándolos.</li><li>Teclado: ←/→ órgano, 1-3 construir, C comer, E remedio.</li></ul>
    ${b ? `<p>Récord: <b>${b}</b></p>` : ''}`,
    button: 'Abrir el parque', onClick: () => { S.phase = 'play'; } });
}

const nRides = () => ZD.reduce((n, z) => n + S.z[z.id].rides.length, 0);
const hostHealth = () => ZD.reduce((s, z) => s + S.z[z.id].health, 0) / ZD.length;
const zoneOpen = id => { const z = S.z[id]; return !z.closed && !z.flood; };
function build(zid, type) {
  const z = S.z[zid], R = RIDES[type], Z = NODE[zid];
  if (z.rides.length >= 3 || S.money < R.cost || z.closed) { G.beep(150, 0.12, 'square', 0.04); return; }
  S.money -= R.cost; z.rides.push({ type, broken: false });
  G.burst(Z.x, Z.y, C.gold, 22, 240, 6); G.shake(4, 0.15);
  G.float('-' + R.cost + '€', Z.x, Z.y - Z.r - 10, C.gold, 22);
  G.beep(520, 0.08, 'triangle', 0.05, 300); setTimeout(() => G.beep(780, 0.1, 'triangle', 0.05), 90);
}
function repair(zid, i) {
  const r = S.z[zid].rides[i]; if (!r || !r.broken || S.money < REPAIR) return;
  S.money -= REPAIR; r.broken = false;
  const p = slotPos(NODE[zid], i); G.burst(p.x, p.y, C.teal, 12, 160, 4); G.beep(900, 0.08, 'sine', 0.05);
}
function feed() {
  if (S.money < FEED || S.phase !== 'play') return;
  S.money -= FEED; S.hunger = 0;
  G.burst(ENT.x, ENT.y, C.lime, 20, 200, 5); G.float('¡Ñam!', ENT.x, ENT.y - 20, C.lime, 26);
  G.beep(300, 0.1, 'sine', 0.06, 200); setTimeout(() => G.beep(260, 0.12, 'sine', 0.06, -80), 110);
}
function remedy() {
  if (S.phase !== 'play' || !S.ev) return;
  if (S.ev === 'indig' && S.money >= ANTI) {
    S.money -= ANTI; S.evT = 0; S.z.estomago.flood = 0;
    G.burst(NODE.estomago.x, NODE.estomago.y, '#fff', 20, 220, 5); G.float('Antiácido', NODE.estomago.x, NODE.estomago.y - 60, C.teal, 22);
    G.beep(700, 0.2, 'sine', 0.05, -300);
  } else if (S.ev === 'fiebre' && S.money >= CLOTH) {
    S.money -= CLOTH; S.temp = Math.max(37, S.temp - 1.6);
    G.burst(270, 170, C.blue, 20, 200, 5); G.float('-1,6°', 270, 150, C.blue, 24); G.beep(600, 0.15, 'sine', 0.05, -200);
  }
}
function startEvent() {
  const opts = Object.keys(EVENTS).filter(k => k !== S.lastEv);
  S.ev = G.pick(opts); S.lastEv = S.ev; S.evT = EVENTS[S.ev].dur; S.evCount++;
  if (S.ev === 'indig') S.z.estomago.flood = 1;
  G.shake(10, 0.4); G.beep(220, 0.3, 'sawtooth', 0.06, -100); setTimeout(() => G.beep(180, 0.3, 'sawtooth', 0.06, -80), 250);
}
function endEvent() { S.z.estomago.flood = 0; S.ev = null; S.nextEv = G.rand(13, 22); }

function spawnVisitor() {
  const cols = G.pick(PILL);
  S.vis.push({ from: 'ent', to: G.pick(NB.ent), t: 0, state: 'walk', happy: 70, money: G.rand(50, 130), rides: 0, maxRides: G.randi(3, 6),
    c1: cols[0], c2: cols[1], ph: G.rand(0, 9), x: ENT.x, y: ENT.y, sick: false });
}
function chooseNext(v, at) {
  if (v.state === 'leave') { return nextHop(at, 'ent'); }
  const opts = NB[at].filter(n => n !== 'ent' && n !== v.prev);
  const cand = opts.length ? opts : NB[at].filter(n => n !== 'ent');
  if (!cand.length) return NB[at][0];
  const w = cand.map(n => { const z = S.z[n]; const work = z.rides.filter(r => !r.broken).length; return zoneOpen(n) ? 0.4 + work * 1.5 : 0.1; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) return cand[i]; }
  return cand[0];
}
function nextHop(from, goal) {
  const prev = { [from]: null }, q = [from];
  while (q.length) { const u = q.shift(); if (u === goal) break; for (const n of NB[u]) if (!(n in prev)) { prev[n] = u; q.push(n); } }
  let c = goal; while (prev[c] !== from && prev[c] !== null) c = prev[c];
  return c;
}
function arrive(v, at) {
  v.prev = v.from; v.from = at; v.t = 0;
  if (at === 'ent' && v.state === 'leave') { v.gone = true; S.served++; S.happySum += v.happy; S.rep = G.lerp(S.rep, v.happy / 100, 0.08); if (v.happy < 35) { S.sad++; G.float(':(', ENT.x, ENT.y - 10, C.pink, 20); } return; }
  if (at !== 'ent' && v.state === 'walk') {
    const z = S.z[at], ok = z.rides.map((r, i) => i).filter(i => !z.rides[i].broken);
    if (zoneOpen(at) && ok.length) {
      const i = G.pick(ok), R = RIDES[z.rides[i].type];
      if (v.money >= R.price) {
        v.money -= R.price; S.money += R.price; v.state = 'ride'; v.rideT = 2.4; v.slot = i; v.rides++;
        v.happy = Math.min(100, v.happy + R.fun * (z.health < 30 ? 0.4 : 1));
        z.earn = (z.earn || 0) + R.price;
        if (Math.random() < 0.3) G.beep(900 + Math.random() * 300, 0.04, 'triangle', 0.02);
        return;
      }
      v.happy -= 12;
    } else v.happy -= 8;
    if (v.happy < 20 || v.rides >= v.maxRides || v.money < 8) v.state = 'leave';
  }
  v.to = chooseNext(v, at);
}

function slotPos(Z, i) { const a = [-2.5, -0.64, 1.57][i]; return { x: Z.x + Math.cos(a) * (Z.r + 4), y: Z.y + Math.sin(a) * (Z.r + 4) }; }

function update(dt) {
  if (S.phase !== 'play') return;
  S.time += dt;
  const d = Math.floor(S.time / DAY) + 1;
  if (d > S.day) {
    S.day = d; const up = nRides() * UPKEEP; S.money -= up;
    G.float('Día ' + Math.min(d, DAYS), 270, 330, C.teal, 30); if (up) G.float('−' + up + '€ mantenimiento', 270, 360, C.pink, 18); G.beep(660, 0.15, 'sine', 0.05, 220);
  }
  if (S.time >= DAY * DAYS) return finish(true);
  // anfitrión
  S.hunger = Math.min(100, S.hunger + 0.42 * dt);
  if (S.ev === 'fiebre') S.temp = Math.min(43, S.temp + 0.16 * dt); else S.temp = Math.max(36.8, S.temp - 0.08 * dt);
  for (const Zd of ZD) {
    const z = S.z[Zd.id];
    const load = z.closed ? Math.min(0, z.rides.reduce((s, r) => s + (r.type === 'enfermeria' ? RIDES.enfermeria.stress : 0), 0)) : z.rides.reduce((s, r) => s + RIDES[r.type].stress, 0);
    let drift = 0.25 - load * 0.2 + (z.closed ? 0.3 : 0);
    if (S.hunger > 75) drift -= S.hunger >= 100 ? 0.8 : 0.35;
    if (S.temp > 41) drift -= 0.7;
    if (z.flood) drift -= 0.6;
    z.health = G.clamp(z.health + drift * dt, 0, 100);
    if (!z.closed && z.health <= 0) { z.closed = true; G.shake(14, 0.5); G.burst(Zd.x, Zd.y, '#777', 30, 260, 7); G.float(Zd.name + ' CERRADO', Zd.x, Zd.y, C.pink, 24); G.beep(110, 0.5, 'sawtooth', 0.07, -60); }
    if (z.closed && z.health >= 50) { z.closed = false; G.float('Reabre ' + Zd.name, Zd.x, Zd.y, C.lime, 20); }
  }
  if (hostHealth() < 18 || S.temp >= 42.5) return finish(false);
  S.earnT = (S.earnT || 0) - dt;
  if (S.earnT <= 0) { S.earnT = 1.2; for (const Z of ZD) { const z = S.z[Z.id]; if (z.earn) { G.float('+' + z.earn + '€', Z.x, Z.y - Z.r - 6, C.gold, 17); z.earn = 0; } } }
  // eventos
  if (S.ev) {
    S.evT -= dt; if (S.evT <= 0) endEvent();
    else if (S.ev === 'gripe') { S.virT = (S.virT || 0) - dt; if (S.virT <= 0) { S.virT = 1.0; spawnVirus(); } }
    else if (S.ev === 'fiebre' && S.temp > 39) {
      S.breakT -= dt;
      if (S.breakT <= 0) {
        S.breakT = 3.5; const all = []; ZD.forEach(Z => S.z[Z.id].rides.forEach((r, i) => !r.broken && r.type !== 'enfermeria' && all.push([Z, r, i])));
        if (all.length) { const [Z, r, i] = G.pick(all); r.broken = true; const p = slotPos(Z, i); G.burst(p.x, p.y, C.gold, 16, 200, 4); G.float('¡Avería!', p.x, p.y - 16, C.gold, 18); G.beep(1400, 0.1, 'square', 0.04, -1000); }
      }
    }
  } else { S.nextEv -= dt; if (S.nextEv <= 0) startEvent(); }
  // visitantes
  const n = nRides();
  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    S.spawnT = n ? G.clamp(4.2 / (0.6 + n * 0.35) / (0.5 + S.rep), 0.5, 6) : 6;
    if (S.vis.length < 45) spawnVisitor();
  }
  for (const v of S.vis) {
    if (v.state === 'ride') {
      v.rideT -= dt; const Z = NODE[v.from], p = slotPos(Z, v.slot), a = G.t * 5 + v.ph;
      v.x = p.x + Math.cos(a) * 12; v.y = p.y + Math.sin(a) * 8;
      if (S.z[v.from].flood || S.z[v.from].closed) v.rideT = 0;
      if (v.rideT <= 0) { v.state = v.rides >= v.maxRides || v.money < 8 ? 'leave' : 'walk'; v.to = chooseNext(v, v.from); v.t = 0; }
      continue;
    }
    if (v.from === v.to) { v.to = chooseNext(v, v.from); }
    const e = edgeOf(v.from, v.to);
    v.t += dt * (v.state === 'leave' ? 80 : 60) / e.len;
    const p = pointOn(v.from, v.to, Math.min(1, v.t)); v.x = p.x; v.y = p.y;
    v.happy -= dt * (0.6 + (S.temp > 39 ? 0.8 : 0) + (S.z[v.to] && S.z[v.to].flood ? 6 : 0));
    if (v.happy < 20 && v.state !== 'leave') v.state = 'leave';
    if (v.t >= 1) arrive(v, v.to);
  }
  S.vis = S.vis.filter(v => !v.gone);
  // virus
  for (const x of S.virus) {
    x.life -= dt;
    let tg = null, bd = 1e9;
    for (const v of S.vis) { if (v.state === 'ride' || v.sick) continue; const dd = G.dist(v.x, v.y, x.x, x.y); if (dd < bd) { bd = dd; tg = v; } }
    const tx = tg ? tg.x : x.wx, ty = tg ? tg.y : x.wy, a = Math.atan2(ty - x.y, tx - x.x);
    x.x += Math.cos(a) * 46 * dt; x.y += Math.sin(a) * 46 * dt;
    if (tg && bd < 14) { tg.sick = true; tg.happy -= 35; tg.state = 'leave'; G.burst(tg.x, tg.y, C.lime, 8, 120, 3); G.beep(200, 0.08, 'square', 0.03, -80); }
    for (const Z of ZD) if (G.dist(x.x, x.y, Z.x, Z.y) < Z.r) S.z[Z.id].health -= 1.2 * dt;
  }
  S.virus = S.virus.filter(x => x.life > 0);
  // entrada
  const p = G.pointer;
  if (p.pressed && p.sy > 140 && p.sy < 722) {
    const vi = S.virus.find(x => G.dist(p.sx, p.sy, x.x, x.y) < 30);
    if (vi) {
      vi.life = 0; S.money += 5; G.burst(vi.x, vi.y, C.lime, 18, 260, 5); G.float('+5€ ¡Chof!', vi.x, vi.y - 16, C.lime, 18);
      G.beep(160, 0.12, 'square', 0.06, -100); G.shake(3, 0.1);
    } else {
      const z = ZD.find(Z => G.dist(p.sx, p.sy, Z.x, Z.y) < Z.r + 18);
      S.sel = z ? z.id : null; if (z) G.beep(500, 0.04, 'triangle', 0.04);
    }
  }
  if (G.keyPressed('ArrowRight') || G.keyPressed('ArrowLeft')) {
    const i = ZD.findIndex(z => z.id === S.sel), d = G.keyPressed('ArrowRight') ? 1 : -1;
    S.sel = ZD[((i < 0 ? 0 : i + d) + ZD.length) % ZD.length].id;
  }
  if (G.keyPressed('Escape')) S.sel = null;
  if (S.sel) ['1', '2', '3'].forEach((k, i) => { if (G.keyPressed(k)) build(S.sel, options(S.sel)[i]); });
  if (G.keyPressed('c') || G.keyPressed('C')) feed();
  if (G.keyPressed('e') || G.keyPressed('E')) remedy();
}
function spawnVirus() {
  const e = G.pick(EDGES), p = pointOn(e.a, e.b, G.rand(0.2, 0.8)), Z = G.pick(ZD);
  S.virus.push({ x: p.x, y: p.y, wx: Z.x, wy: Z.y, life: 28, ph: G.rand(0, 9) });
  G.beep(260, 0.06, 'sawtooth', 0.025, 120);
}
const options = zid => [NODE[zid].spec, 'chuches', 'enfermeria'];
function score() { return Math.max(0, Math.round((S.money + S.happySum / 4) * (S.dead ? 0.5 : 1))); }
function finish(win) {
  S.phase = 'over'; S.dead = !win;
  const sc = score(), b = G.best('parque-interno', sc);
  const avg = S.served ? Math.round(S.happySum / S.served) : 0;
  if (win) { G.burst(270, 400, C.gold, 60, 400, 7); G.beep(523, 0.15, 'triangle', 0.06); setTimeout(() => G.beep(784, 0.3, 'triangle', 0.06), 150); }
  else { G.shake(20, 0.8); G.beep(300, 0.9, 'sawtooth', 0.07, -250); }
  setTimeout(() => G.screen({ sub: win ? 'Temporada completada' : 'Día ' + S.day + ' de ' + DAYS,
    title: win ? '¡Don Anselmo sigue vivo!' : 'Don Anselmo ha fallecido', big: sc + ' pts',
    html: `<ul><li>Dinero: <b>${Math.round(S.money)} €</b></li><li>Visitantes atendidos: <b>${S.served}</b> (felicidad media ${avg}%)</li>
      <li>Puntos de felicidad: <b>+${Math.round(S.happySum / 4)}</b></li>${win ? '' : '<li>Anfitrión fallecido: <b>−50%</b></li>'}${S.sad ? `<li>Se fueron tristes: ${S.sad}</li>` : ''}</ul>
      <p>${win ? 'El parque cierra por temporada. El anfitrión, agotado pero entero.' : 'El parque ha cerrado. Para siempre. Los visitantes piden reembolso.'}</p><p>Récord: <b>${b}</b></p>`,
    button: 'Otra temporada', onClick: newGame }), win ? 400 : 900);
}

// ---------- Dibujo ----------
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t), g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t), bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
  return `rgb(${r},${g},${bl})`;
}
function drawBody() {
  const sick = G.clamp((100 - hostHealth()) / 100 + (S.ev === 'indig' ? 0.3 : 0), 0, 1);
  const skin = mix('#E8B894', '#A9C98A', sick * 0.7), fever = G.clamp((S.temp - 37.5) / 4, 0, 1);
  const sk = fever > 0 ? mix('#E8B894', '#FF7A6A', fever * 0.6) : skin;
  const br = 1 + Math.sin(G.t * 1.6) * 0.012;
  ctx.save(); ctx.translate(270, 500); ctx.scale(br, 1); ctx.translate(-270, -500);
  // brazos, torso, cuello, cabeza
  G.rrect(28, 350, 64, 330, 32, sk); G.rrect(448, 350, 64, 330, 32, sk);
  G.rrect(66, 318, 408, 408, 110, sk); G.rrect(236, 290, 68, 50, 10, sk);
  G.circle(270, 226, 84, sk); G.circle(186, 232, 16, sk); G.circle(354, 232, 16, sk);
  G.rrect(92, 344, 356, 362, 92, '#4A2033');
  ctx.restore();
  G.circle(270, 196, 50, '#4A2033');
  // cara dormida
  ctx.strokeStyle = '#5A3A2A'; ctx.lineWidth = 3;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(270 + s * 42, 252, 10, 0.2, Math.PI - 0.2); ctx.stroke(); }
  ctx.fillStyle = '#6B4A3A'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(270 + s * 12, 272, 14, 5, s * 0.25, 0, 7); ctx.fill(); }

function drawVirus(x) {
