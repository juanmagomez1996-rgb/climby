<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Una rosa cada día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Gochi+Hand&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0b0b0d; --panel:#161619; --line:#2a2a30;
  --text:#e6e3e6; --muted:#8f8a92; --rose:#b3263f; --rose2:#e7a3b1; --warm:#e0b27a;
}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:16px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:-.01em;color:#cfcbd0}
#hud{display:flex;gap:14px;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
#hWorld b{font-weight:600;color:var(--text)}
#snd{font:600 11px 'Figtree',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;cursor:pointer}
.stage{position:relative;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #1d1d22}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:480/272}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:6px 14px;font-family:'Gochi Hand',cursive;font-size:clamp(16px,2.4vw,22px);color:var(--rose2);text-align:center;opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 1px 8px #000}
#toast.show{opacity:1}
#toast.hint{font-family:'Figtree',system-ui,sans-serif;font-size:14px;color:#d8d4d9}
#toast small{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.help{margin:0;font-size:13px;color:var(--muted);line-height:1.8}
.help kbd{font:600 12px 'Figtree',system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:10px}
.pad button{width:66px;height:66px;border-radius:50%;font-size:20px;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--text);touch-action:none}
.pad button.wide{width:84px;font-size:13px}
.pad button.jump{background:var(--rose);border:0}
.pad button.held{filter:brightness(1.4)}
@media (pointer:coarse){.pad{display:flex}.help{display:none}}
button{font:600 15px 'Figtree',system-ui,sans-serif;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
#card{position:fixed;inset:0;z-index:30;background:rgba(5,5,7,.9);display:grid;place-items:center;padding-inline:16px;overflow-y:auto}
#card.soft{background:rgba(5,5,7,.4);place-items:end center}
#card.soft .in{background:rgba(8,8,10,.92);border-radius:12px;padding-inline:20px;margin-block-end:16px}
#card .in{max-width:540px;width:100%;display:flex;flex-direction:column;gap:14px;padding-block:24px;animation:fade .9s ease}
@keyframes fade{from{opacity:0}}
#cTitle{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.05;text-wrap:balance;color:#d9d5da}
#cLines{display:flex;flex-direction:column;gap:12px}
#cLines p{margin:0;font-size:17px;line-height:1.55}
#cLines p.hand{font-family:'Gochi Hand',cursive;font-size:24px;line-height:1.3;color:var(--rose2)}
#cLines .who{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
#cLines p.big{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:clamp(22px,4vw,30px);line-height:1.3;text-wrap:balance}
#cLines p.hint{font-size:14px;color:var(--muted)}
#cNames{display:flex;flex-direction:column;gap:12px}
#cNames label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
#cNames input{font:16px 'Figtree',system-ui,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){#card .in{animation:none}#toast{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Una rosa cada día</h1>
    <div id="hud"><span id="hDay">Día 1</span><span id="hWorld">Mundo: <b>de ella</b></span><button id="snd" type="button">Sonido: sí</button></div>
  </header>
  <div class="stage">
    <canvas id="game" aria-label="Juego de plataformas. Una sombra te persigue desde la izquierda."></canvas>
    <div id="toast"></div>
  </div>
  <p class="help"><kbd>←</kbd> <kbd>→</kbd> moverte · <kbd>↑</kbd> o <kbd>Espacio</kbd> saltar · <kbd>Shift</kbd> o <kbd>X</kbd> cambiar de mundo (también en el aire) · <kbd>C</kbd> ver colisiones</p>
  <div class="pad">
    <div><button data-k="l" aria-label="Izquierda">◀</button><button data-k="r" aria-label="Derecha">▶</button></div>
    <div><button class="wide" data-k="m">Mundo</button><button class="wide jump" data-k="j">Saltar</button></div>
  </div>
</div>

<div id="card" hidden>
  <div class="in">
    <h2 id="cTitle"></h2>
    <div id="cLines"></div>
    <div id="cNames" hidden>
      <label for="nameH">¿Cómo se llamaba tu hermano? (opcional)
        <input id="nameH" maxlength="24" autocomplete="off" placeholder="tu hermano">
      </label>
      <label for="nameM">¿Cómo le dicen a tu mamá? (opcional)
        <input id="nameM" maxlength="24" autocomplete="off" placeholder="mamá">
      </label>
    </div>
    <div><button id="cBtn"></button></div>
  </div>
</div>

<script>
(() => {
const T = 16, ROWS = 17, VW = 480, VH = 272;
const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

let names = { h: '', m: '' };
try { const n = JSON.parse(localStorage.getItem('rosa-names') || 'null'); if (n) names = n; } catch (e) {}
const Hn = () => names.h.trim() || 'tu hermano';
const Mn = () => names.m.trim() || 'tu mamá';
const Ms = () => names.m.trim() || 'mamá';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const S = { state: 'load', level: 0, t: 0, world: 'A', wf: 0, shX: -999, shOn: false, timer: 0, roses: 0, endStep: 0, resp: null, ripple: 0, blocked: 0, shake: 0, hinted: false, debug: false };
let L = null, P = null, cam = 0;

/* ---------- assets (generated with Higgsfield; fog is CC0) ---------- */
const SRC = {
  brother: 'assets/brother.png', mother: 'assets/mother.png',
  forestA_far: 'assets/forestA_far.webp', forestA_mid: 'assets/forestA_mid.webp',
  gardenB_far: 'assets/gardenB_far.webp', gardenB_mid: 'assets/gardenB_mid.webp',
  cave_far: 'assets/cave_far.webp', cave_mid: 'assets/cave_mid.webp', rain_far: 'assets/rain_far.webp',
  ground: 'assets/ground.webp', house: 'assets/house.webp', shadow: 'assets/shadow.webp', fog: 'assets/fog.png',
};
const IMG = {}, ATLAS = {}; let META = {};
function loadAll() {
  const imgs = Object.entries(SRC).map(([k, s]) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => r(); i.src = s; }));
  const js = ['brother', 'mother', 'meta'].map(k => fetch(`assets/${k}.json`).then(r => r.json()).then(d => { if (k === 'meta') META = d; else ATLAS[k] = d; }).catch(() => {}));
  return Promise.all([...imgs, ...js]);
}
let fogAlpha = null;
function makeFog() {
  if (!IMG.fog) return;
  try {
    const c = document.createElement('canvas'); c.width = IMG.fog.width; c.height = IMG.fog.height;
    const x = c.getContext('2d'); x.drawImage(IMG.fog, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    const W = c.width, H = c.height;
    for (let i = 0; i < p.length; i += 4) {
      const y = (i / 4 / W | 0) / H, edge = Math.pow(Math.sin(Math.PI * y), 3), xx = (i / 4 % W) / W, side = Math.min(1, Math.sin(Math.PI * xx) * 4 + .6);
      p[i + 3] = (p[i] + p[i + 1] + p[i + 2]) / 3 * edge * Math.min(1, side); p[i] = p[i + 1] = p[i + 2] = 255;
    }
    x.putImageData(d, 0, 0); fogAlpha = c;
  } catch (e) { fogAlpha = null; }
}
const tintCache = new Map();
function tinted(src, color, key) {
  if (!src) return null; const id = key + color; if (tintCache.has(id)) return tintCache.get(id);
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  tintCache.set(id, c); return c;
}
const grain = document.createElement('canvas'); grain.width = grain.height = 96;
{ const g = grain.getContext('2d'), d = g.createImageData(96, 96); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

/* ---------- levels ---------- */
// '#' solid in both worlds · 'a' only in hers · 'b' only in his · '=' ledge in both · '1' ledge only hers · '2' ledge only his
function mk(w, o) { return Object.assign({ w, g: Array.from({ length: ROWS }, () => Array(w).fill('.')), checks: [], says: [], goalCol: w - 14, speed: 1.1 }, o); }
const block = (L, a, b, top, bot = ROWS - 1, t = '#') => { for (let x = a; x <= b; x++) for (let y = top; y <= bot; y++) L.g[y][x] = t; };
const ground = (L, a, b, top = 15, t = '#') => block(L, a, b, top, ROWS - 1, t);
const ledge = (L, x, y, w, t = '=') => { for (let i = 0; i < w; i++) L.g[y][x + i] = t; };
const check = (L, x) => L.checks.push({ col: x, x: x * T + 8, on: false });
const say = (L, col, who, text) => L.says.push({ x: col * T, who, text, done: false });

const LEVELS = [
  () => { const L = mk(130, { theme: 'forest', speed: 1.05 });
    ground(L, 0, 20); ground(L, 21, 26, 15, 'b'); ground(L, 27, 40); block(L, 34, 34, 11, 14, 'a');
    ledge(L, 41, 13, 4, '1'); ground(L, 45, 60); check(L, 47);
    ledge(L, 62, 13, 3, '2'); ledge(L, 66, 11, 3, '1'); ledge(L, 70, 13, 3, '2');
    ground(L, 74, 90); block(L, 80, 80, 11, 14, 'b'); ledge(L, 93, 12, 2); ground(L, 96, 129); check(L, 98);
    L.goalCol = 112;
    say(L, 3, 'h', 'Te lo prometí, ma. Una rosa todos los días.');
    say(L, 15, 'n', 'Hay caminos que solo existen en su mundo, y otros solo en el de él. Cambia con Shift o X.');
    say(L, 50, 'h', 'Cuando me cantabas para dormir…');
    say(L, 60, 'n', 'Salta, y cambia de mundo en el aire.');
    say(L, 100, 'h', 'Ya casi llego.');
    return L; },
  () => { const L = mk(140, { theme: 'cave', speed: 1.2 });
    ground(L, 0, 14); ledge(L, 16, 13, 2, '2'); ledge(L, 20, 12, 2, '2');
    ground(L, 23, 34); block(L, 28, 28, 10, 14, 'a'); check(L, 25);
    ground(L, 35, 37, 13, 'b'); ground(L, 38, 40, 11, 'b'); ground(L, 41, 52, 13); check(L, 44);
    ledge(L, 54, 12, 2, '1'); ledge(L, 58, 10, 2, '2'); ledge(L, 62, 12, 2, '1');
    ground(L, 66, 80, 13); block(L, 72, 72, 9, 12, 'b'); check(L, 68);
    ground(L, 81, 95); block(L, 85, 92, 0, 11);
    ground(L, 96, 104, 15, 'b'); ground(L, 105, 139); check(L, 107);
    L.goalCol = 122;
    say(L, 2, 'h', 'Aquí abajo no se ve nada. Pero la rosa alumbra.');
    say(L, 30, 'h', 'Suena el agua. Como tu cocina de noche.');
    say(L, 70, 'h', 'Me acuerdo de tus manos oliendo a jabón.');
    say(L, 110, 'h', 'Ya veo tu ventana.');
    return L; },
  () => { const L = mk(150, { theme: 'rain', speed: 1.35, closed: true });
    ground(L, 0, 12); ledge(L, 14, 13, 2, '1'); ledge(L, 18, 11, 2, '2'); ledge(L, 22, 13, 2, '1');
    ground(L, 25, 36); block(L, 30, 30, 10, 14, 'a'); block(L, 33, 33, 10, 14, 'b'); check(L, 27);
    ground(L, 37, 40, 13);
    ledge(L, 42, 11, 2, '2'); ledge(L, 45, 9, 2, '1'); ledge(L, 48, 11, 2, '2'); ledge(L, 51, 13, 2, '1'); ledge(L, 54, 12, 2, '2');
    ground(L, 57, 72); check(L, 59); ground(L, 73, 78, 15, 'b');
    ground(L, 79, 92); block(L, 84, 84, 9, 14, 'a'); block(L, 88, 88, 9, 14, 'b'); check(L, 81);
    ledge(L, 95, 12, 2); ledge(L, 98, 11, 2, '2'); ground(L, 101, 149); check(L, 103);
    L.goalCol = 132;
    say(L, 2, 'h', 'Hoy está difícil, ¿verdad? Igual te la llevo.');
    say(L, 38, 'h', '«Te quiero hasta el cielo», me decías.');
    say(L, 104, 'h', 'Aunque hoy no la veas, te llega.');
    return L; },
  () => { const L = mk(100, { theme: 'dream', speed: 0, dream: true });
    ground(L, 0, 30); ground(L, 31, 36, 14); ground(L, 37, 60); ground(L, 61, 64, 14); ground(L, 65, 99);
    L.goalCol = 88;
    say(L, 6, 'm', 'Sus zapatos siempre tirados en la entrada.');
    say(L, 40, 'm', 'Su taza de dinosaurios.');
    say(L, 70, 'm', '«Mamá, cuando tú mueras…»');
    return L; },
];
const INTRO = [
  { title: 'Día 1 · El bosque', lines: [
    { t: () => `${cap(Mn())} sigue viva, pero una parte de ella se fue contigo. Detrás de ti viene la tristeza, y no se detiene.` },
    { hand: 'Te lo prometí, ma. Una rosa todos los días.' },
    { hint: 'Hay dos mundos: el de ella, frío, y el de él, un jardín tibio. Algunos caminos solo existen en uno. En el mundo de él, la sombra avanza más despacio. La ventana de ella solo está en su mundo.' }] },
  { title: 'Día 2 · La cueva', lines: [{ t: 'Hoy el camino baja. Hace frío y gotea.' }, { hand: 'No te preocupes, ma. Conozco el camino.' }] },
  { title: 'Día 3 · La lluvia', lines: [{ t: 'Hoy es un día malo. La sombra viene más rápido.' }, { hand: 'Hoy está difícil, ¿verdad? Igual te la llevo.' }] },
  { title: 'La última noche', lines: [{ t: () => `Esa noche, ${Mn()} sueña. Esta vez juegas como ella, y la sombra ya no la sigue.` }, { hint: 'Camina hacia la luz.' }] },
];
const GOAL = [
  () => 'Dejas la rosa en su ventana. Por un momento, la sombra se detiene.',
  () => 'Ella abre la ventana y toma la rosa. La pone en un vaso con agua.',
  () => 'La ventana está cerrada. Dejas la rosa en el borde, bajo la lluvia. Mañana la va a encontrar.',
];
const END = [
  [{ hand: 'Hola, ma. Esta te la guardé.' }],
  [{ t: 'Ella la toma. Lo abraza. Quiere quedarse ahí con él.' }],
  [{ hand: 'No, ma. Allá te están esperando. Yo te sigo mandando una todos los días.' }],
  [{ t: () => `Al despertar, ${Mn()} abre las cortinas ella sola. En la ventana hay tres rosas.` },
   { big: 'Una parte de ella se fue con él. Pero el resto se quedó con nosotros.' }],
];

/* ---------- audio (synthesized) ---------- */
let AC = null, AU = {}, soundOn = true;
try { soundOn = localStorage.getItem('rosa-sound') !== 'off'; } catch (e) {}
$('#snd').textContent = soundOn ? 'Sonido: sí' : 'Sonido: no';
function audioStart() {
  if (AC || !soundOn) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const m = AC.createGain(); m.gain.value = .55; m.connect(AC.destination); AU.m = m;
  const dl = AC.createDelay(); dl.delayTime.value = .37; const fb = AC.createGain(); fb.gain.value = .5;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
  dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(m); AU.verb = dl;
  const pad = (freqs, type, cut, detune) => {
    const g = AC.createGain(); g.gain.value = 0; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; f.connect(g); g.connect(m);
    for (const fr of freqs) for (const d of [-detune, detune]) { const o = AC.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = d; o.connect(f); o.start(); }
    return g;
  };
  AU.A = pad([55, 65.41, 82.41], 'sawtooth', 260, 7);
  AU.B = pad([110, 138.59, 164.81], 'triangle', 900, 4);
  const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const nf = AC.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 140;
  AU.rum = AC.createGain(); AU.rum.gain.value = 0; ns.connect(nf); nf.connect(AU.rum); AU.rum.connect(m); ns.start();
  const rf = AC.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 2500; rf.Q.value = .5;
  AU.rain = AC.createGain(); AU.rain.gain.value = 0; ns.connect(rf); rf.connect(AU.rain); AU.rain.connect(m);
}
function tone(freq, dur, vol, type = 'sine', slide) {
  if (!AC || !soundOn) return;
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur * .6);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(AU.m); g.connect(AU.verb); o.start(t0); o.stop(t0 + dur + .05);
}
function step_sound() { if (!AC || !soundOn) return; tone(90 + Math.random() * 30, .08, .05, 'triangle', 60); }
const NOTES = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];
let nextNote = 2, nextDrip = 1;
function audioTick(dt) {
  if (!AC || !soundOn) return;
  const now = AC.currentTime, dream = L && L.dream;
  AU.A.gain.setTargetAtTime(.075 * (1 - S.wf), now, .25);
  AU.B.gain.setTargetAtTime(.05 * S.wf, now, .25);
  const near = S.shOn && S.state === 'play' ? Math.max(0, 1 - (P.x - S.shX) / 220) : 0;
  AU.rum.gain.setTargetAtTime(.5 * near, now, .2);
  AU.rain.gain.setTargetAtTime(L && L.theme === 'rain' ? .05 * (1 - S.wf * .6) : 0, now, .5);
  nextNote -= dt;
  if (nextNote <= 0) { const n = NOTES[Math.floor(Math.random() * NOTES.length)] * (S.wf > .5 || dream ? 1 : .5); tone(n, 3.5, .06, 'triangle'); nextNote = 3 + Math.random() * 4; }
  if (L && L.theme === 'cave') { nextDrip -= dt; if (nextDrip <= 0) { tone(1500 + Math.random() * 700, .18, .07, 'sine', 500); nextDrip = .8 + Math.random() * 2.2; } }
}
$('#snd').onclick = () => {
  soundOn = !soundOn; $('#snd').textContent = soundOn ? 'Sonido: sí' : 'Sonido: no';
  try { localStorage.setItem('rosa-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  if (soundOn) { audioStart(); AC && AC.resume(); } else if (AC) AC.suspend();
};

/* ---------- helpers ---------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circ(c, x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
function roseHead(c, x, y, r) {
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; circ(c, x + Math.cos(a) * r * .45, y + Math.sin(a) * r * .45, r * .6, '#b3263f'); }
  circ(c, x, y, r * .55, '#7e1428');
}

    c.fillStyle = '#030304'; c.fillRect(cam - 10, 0, VW + 20, 10);
    const i0 = Math.floor(cam / 22) - 1;
    for (let i = i0; i < i0 + 26; i++) { const x = i * 22 + hash(i) * 10, h = 10 + hash(i * 3) * 34; c.beginPath(); c.moveTo(x - 8, 8); c.lineTo(x + 8, 8); c.lineTo(x + hash(i * 5) * 4, 8 + h); c.closePath(); c.fill(); }
  }
  if (!L.dream) drawHouse(c);
  drawTiles(c);
  for (const ck of L.checks) {
    const gy = topOf(ck.col) * T;
    c.strokeStyle = '#1d2a1a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(ck.x, gy); c.quadraticCurveTo(ck.x - 4, gy - 10, ck.x, gy - 18); c.stroke();
    if (ck.on) { const g = c.createRadialGradient(ck.x, gy - 19, 1, ck.x, gy - 19, 16); g.addColorStop(0, 'rgba(200,50,80,.5)'); g.addColorStop(1, 'rgba(200,50,80,0)'); c.fillStyle = g; c.fillRect(ck.x - 16, gy - 35, 32, 32); roseHead(c, ck.x, gy - 19, 3.8); }
    else { c.fillStyle = '#2a3a26'; c.beginPath(); c.ellipse(ck.x, gy - 20, 2.4, 4, 0, 0, 7); c.fill(); }
  }
  if (L.dream) {
    const gy = topOf(L.goalCol) * T, g = c.createRadialGradient(L.goalX, gy - 20, 4, L.goalX, gy - 20, 60);
    g.addColorStop(0, 'rgba(255,215,160,.35)'); g.addColorStop(1, 'rgba(255,215,160,0)'); c.fillStyle = g; c.fillRect(L.goalX - 60, gy - 80, 120, 90);
    drawSprite(c, 'brother', 'idle', Math.floor(t * 8) % (ATLAS.brother ? ATLAS.brother.anims.idle.frames : 1), L.goalX, gy, -1);
  }
  // player
  if (!(S.state === 'caught' && S.timer > 20 && S.timer < 40)) {
    const p = pose();
    if (p) {
      const cx = P.x + P.w / 2, base = P.y + P.h;
      // soft contact shadow on the ground
      if (P.on) { c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(cx, base, 9, 2, 0, 0, 7); c.fill(); }
      if (!L.dream) { const g = c.createRadialGradient(cx + P.face * 6, base - 14, 1, cx + P.face * 6, base - 14, 22); g.addColorStop(0, `rgba(200,40,70,${S.delivered ? 0 : .22})`); g.addColorStop(1, 'rgba(200,40,70,0)'); c.fillStyle = g; c.fillRect(cx - 30, base - 40, 60, 50); }
      drawSprite(c, p.sheet, p.anim, p.f, cx, base, P.face);
    }
  }
  if (S.state === 'deliver') {
    const r = houseRect(), k = Math.min(1, S.timer / 60), e = k * k * (3 - 2 * k);
    const tx = r.winX + 5 + S.roses * 7, ty = r.sillY - 8;
    const x = S.from.x + (tx - S.from.x) * e, y = S.from.y + (ty - S.from.y) * e - Math.sin(e * Math.PI) * 30;
    const g = c.createRadialGradient(x, y, 1, x, y, 14); g.addColorStop(0, 'rgba(200,50,80,.55)'); g.addColorStop(1, 'rgba(200,50,80,0)'); c.fillStyle = g; c.fillRect(x - 14, y - 14, 28, 28);
    roseHead(c, x, y, 2.6 + (1 - e) * 1.2);
  }
  if (S.ripple > 0) { c.strokeStyle = S.world === 'B' ? `rgba(243,197,143,${S.ripple})` : `rgba(201,210,218,${S.ripple})`; c.lineWidth = 2; c.beginPath(); c.arc(P.x + P.w / 2, P.y + 14, (1 - S.ripple) * 160, 0, 7); c.stroke(); }
  if (S.blocked > 0) { c.strokeStyle = `rgba(180,40,60,${S.blocked})`; c.lineWidth = 2; c.strokeRect(P.x - 3, P.y - 3, P.w + 6, P.h + 6); }
  drawShadow(c, t);
  if (S.debug) {
    c.lineWidth = 1;
    const c0 = Math.max(0, Math.floor(cam / T) - 1), c1 = Math.min(L.w - 1, c0 + 32);
    for (let cx = c0; cx <= c1; cx++) for (let cy = 0; cy < ROWS; cy++) {
      const tt = L.g[cy][cx];
      if (solidIn(tt, S.world)) { c.strokeStyle = 'rgba(80,255,120,.8)'; c.strokeRect(cx * T + .5, cy * T + .5, T - 1, T - 1); }
      else if (ledgeIn(tt, S.world)) { c.strokeStyle = 'rgba(80,200,255,.9)'; c.beginPath(); c.moveTo(cx * T, cy * T + .5); c.lineTo(cx * T + T, cy * T + .5); c.stroke(); }
    }
    c.strokeStyle = P.on ? '#ff0' : '#f80'; c.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);
    if (!L.dream) { const r = houseRect(); c.strokeStyle = '#f0f'; c.beginPath(); c.moveTo(r.winX, 0); c.lineTo(r.winX, VH); c.stroke(); }
    if (S.shOn) { c.strokeStyle = '#f44'; c.beginPath(); c.moveTo(S.shX, 0); c.lineTo(S.shX, VH); c.stroke(); }
  }
  c.restore();

  if (L.theme === 'rain') {
    c.strokeStyle = `rgba(190,200,210,${.35 * (1 - S.wf * .6)})`; c.lineWidth = 1; c.beginPath();
    for (let i = 0; i < 110; i++) { const x = (hash(i) * 560 - (t * 90 + i * 13) % 560 + 560) % 560 - 40, y = (hash(i * 3) * VH + t * 420) % (VH + 20) - 10; c.moveTo(x, y); c.lineTo(x - 3, y + 9); }
    c.stroke();
  }
  if (L.theme === 'cave') for (let i = 0; i < 6; i++) { const x = ((hash(i) * 900 - cam) % 520 + 520) % 520 - 20, y = ((t * 160 + hash(i * 7) * 400) % 300) - 20; if (y > 20) circ(c, x, y, 1.2, 'rgba(200,210,220,.6)'); }
  for (let i = 0; i < 20; i++) { const x = (hash(i * 11) * VW + Math.sin(t * .3 + i) * 20 - cam * .9 % VW + VW * 2) % VW, y = hash(i * 17) * VH + Math.sin(t * .5 + i * 2) * 10; circ(c, x, y, .9, S.wf > .5 ? 'rgba(255,215,160,.45)' : 'rgba(210,215,220,.3)'); }

  const vg = c.createRadialGradient(VW / 2, VH / 2, VH * .35, VW / 2, VH / 2, VW * .7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  c.fillStyle = vg; c.fillRect(-10, -10, VW + 20, VH + 20);
  c.globalAlpha = .06; c.globalCompositeOperation = 'overlay';
  const gx = Math.floor(Math.random() * 96), gy2 = Math.floor(Math.random() * 96);
  for (let x = -gx; x < VW; x += 96) for (let y = -gy2; y < VH; y += 96) c.drawImage(grain, x, y);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  if (S.state === 'caught') { const k = S.timer < 40 ? S.timer / 30 : 1 - (S.timer - 40) / 40; c.fillStyle = `rgba(0,0,0,${Math.min(1, Math.max(0, k))})`; c.fillRect(-10, -10, VW + 20, VH + 20); }
}

/* ---------- loop ---------- */
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
introCard(true);
loadAll().then(() => {
  makeFog();
  L = LEVELS[0](); L.goalX = L.goalCol * T;
  P = { x: 3 * T, y: topOf(3) * T - 36, w: 10, h: 36, vx: 0, vy: 0, on: true, face: 1, animT: 0, airT: 0, landT: 0, stepT: 0 };
  introCard();
  requestAnimationFrame(frame);
});
})();
</script>
