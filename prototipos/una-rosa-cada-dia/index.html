<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Una rosa cada día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Gochi+Hand&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#000; --panel:#111; --line:#262626;
  --text:#d9d9d6; --muted:#7c7c78; --rose:#8f1d30; --rose2:#d99aa6;
}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:16px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:'Figtree',system-ui,sans-serif;font-weight:400;font-size:13px;letter-spacing:.42em;text-transform:uppercase;margin:0;color:#8a8a86}
#hud{display:flex;gap:14px;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#snd{font:600 11px 'Figtree',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;cursor:pointer}
.stage{position:relative;overflow:hidden;background:#000}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:6px 14px;font-family:'Gochi Hand',cursive;font-size:clamp(16px,2.3vw,22px);color:#e6e2dc;text-align:center;opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 1px 10px #000}
#toast.show{opacity:1}
#toast.hint{font-family:'Figtree',system-ui,sans-serif;font-size:13px;letter-spacing:.06em;color:#bdbdb8}
#toast small{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.help{margin:0;font-size:12px;color:var(--muted);line-height:1.9;letter-spacing:.02em}
.help kbd{font:600 11px 'Figtree',system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:#bcbcb8}
.pad{display:none;flex-wrap:wrap;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:10px}
.pad button{width:64px;height:64px;border-radius:50%;font-size:20px;padding:0;background:#0d0d0d;border:1px solid var(--line);color:#bbb;touch-action:none}
.pad button.wide{width:68px;font-size:11px;letter-spacing:.04em}
.pad button.held{background:#262626}
@media (pointer:coarse){.pad{display:flex}.help{display:none}}
button{font:600 13px 'Figtree',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;background:transparent;color:#e6e2dc;border:1px solid #3a3a38;border-radius:2px;padding:11px 22px;cursor:pointer}
button:hover{background:#161616}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:1px solid #bbb;outline-offset:3px}
#card{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.94);display:grid;place-items:center;padding-inline:16px;overflow-y:auto}
#card.soft{background:rgba(0,0,0,.35);place-items:end center}
#card.soft .in{background:rgba(0,0,0,.9);padding-inline:20px;margin-block-end:16px}
#card .in{max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px;padding-block:28px;animation:fade 1.4s ease}
@keyframes fade{from{opacity:0}}
#cTitle{font-family:'Figtree',system-ui,sans-serif;font-weight:400;font-size:clamp(15px,2.6vw,18px);letter-spacing:.42em;text-transform:uppercase;margin:0;color:#cfcfca}
#cLines{display:flex;flex-direction:column;gap:12px}
#cLines p{margin:0;font-size:17px;line-height:1.6;color:#bdbdb8}
#cLines p.hand{font-family:'Gochi Hand',cursive;font-size:24px;line-height:1.3;color:#e6e2dc}
#cLines .who{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#cLines p.big{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:clamp(22px,4vw,30px);line-height:1.3;color:#e6e2dc;text-wrap:balance}
#cLines p.hint{font-size:13px;color:var(--muted);letter-spacing:.04em}
#cNames{display:flex;flex-direction:column;gap:12px}
#cNames label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
#cNames input{font:16px 'Figtree',system-ui,sans-serif;background:#0a0a0a;color:var(--text);border:1px solid var(--line);border-radius:2px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){#card .in{animation:none}#toast{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Una rosa cada día</h1>
    <div id="hud"><span id="hDay"></span><button id="snd" type="button">Sonido: sí</button></div>
  </header>
  <div class="stage">
    <canvas id="game" aria-label="Juego de plataformas en blanco y negro. Un niño lleva una rosa roja a la ventana de su mamá."></canvas>
    <div id="toast"></div>
  </div>
  <p class="help"><kbd>←</kbd> <kbd>→</kbd> caminar · <kbd>↑</kbd> o <kbd>Espacio</kbd> saltar y trepar · en la cuerda: <kbd>←</kbd> <kbd>→</kbd> balancearte, <kbd>↑</kbd> <kbd>↓</kbd> subir y bajar, <kbd>Espacio</kbd> soltarte · <kbd>↓</kbd> o <kbd>R</kbd> dejar o recoger la rosa · mantén <kbd>Shift</kbd> o <kbd>E</kbd> para jalar cajas, usar palancas y tomar la mano de mamá · <kbd>C</kbd> ver colisiones</p>
  <div class="pad">
    <div><button data-k="l" aria-label="Izquierda">◀</button><button data-k="r" aria-label="Derecha">▶</button></div>
    <div><button class="wide" data-k="d">Rosa</button><button class="wide" data-k="g">Agarrar</button><button class="wide" data-k="j">Saltar</button></div>
  </div>
</div>

<div id="card" hidden>
  <div class="in">
    <h2 id="cTitle"></h2>
    <div id="cLines"></div>
    <div id="cNames" hidden>
      <label for="nameH">¿Cómo se llamaba tu hermano? (opcional)
        <input id="nameH" maxlength="24" autocomplete="off" placeholder="tu hermano">
      </label>
      <label for="nameM">¿Cómo le dicen a tu mamá? (opcional)
        <input id="nameM" maxlength="24" autocomplete="off" placeholder="mamá">
      </label>
    </div>
    <div><button id="cBtn"></button></div>
  </div>
</div>

<script>
(() => {

const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

try { const n = JSON.parse(localStorage.getItem('rosa-names') || 'null'); if (n) names = n; } catch (e) {}
const Hn = () => names.h.trim() || 'tu hermano';
const Mn = () => names.m.trim() || 'tu mamá';
const Ms = () => names.m.trim() || 'mamá';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- assets ---------- */
const PROPS = ['treeTall', 'treeSmall', 'grass', 'thorns', 'log', 'rock', 'roots', 'fence', 'stalL', 'stalM', 'stalS', 'mineFrame', 'stagL', 'stagM', 'chain', 'lantern', 'crate', 'trapOpen', 'trapShut', 'boulder', 'gate', 'lever', 'plate', 'rope',
  'stump', 'mushrooms', 'fern', 'deadBush', 'branch', 'sign', 'reeds', 'rockPile', 'cross', 'tomb', 'crow', 'tireSwing', 'scarecrow', 'wheel', 'well', 'birdhouse',
  'cart', 'rail', 'barrels', 'ladder', 'planks', 'rootCurtain', 'crystals', 'pickaxe', 'lamp', 'pole', 'trashcan', 'fenceBroken', 'bicycle', 'doghouse', 'clothesline', 'steps'];
const SRC = { brother: 'assets/brother.png', brother_nr: 'assets/brother_nr.png', mother: 'assets/mother.png', forest_far: 'assets/forest_far.webp', cave_far: 'assets/cave_far.webp', rain_far: 'assets/rain_far.webp',
  forest_mid: 'assets/forest_mid.webp', cave_ceil: 'assets/cave_ceil.webp', grass: 'assets/grass.png', house: 'assets/house.png', shadow: 'assets/shadow.webp', fog: 'assets/fog.png', hang: 'assets/hang.png', fgrass: 'assets/fgrass.png' };
for (const p of PROPS) SRC[p] = `assets/props/${p}.png`;
const IMG = {}, ATLAS = {}; let META = {};
function loadAll() {
  const imgs = Object.entries(SRC).map(([k, s]) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => r(); i.src = s; }));
  const js = [['brother', 'assets/brother.json'], ['mother', 'assets/mother.json'], ['meta', 'assets/meta.json']].map(([k, u]) =>

  return Promise.all([...imgs, ...js]);
}
const tintCache = new Map();
function tinted(key, color) {
  const src = key === 'fogA' ? fogAlpha : IMG[key]; if (!src) return null;
  const id = key + color; if (tintCache.has(id)) return tintCache.get(id);
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);

let fogAlpha = null;
function makeFog() {
  if (!IMG.fog) return;
  try {
    const c = document.createElement('canvas'); c.width = IMG.fog.width; c.height = IMG.fog.height;
    const x = c.getContext('2d'); x.drawImage(IMG.fog, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data, W = c.width, H = c.height;
    for (let i = 0; i < p.length; i += 4) {
      const y = (i / 4 / W | 0) / H, xx = (i / 4 % W) / W;
      p[i + 3] = (p[i] + p[i + 1] + p[i + 2]) / 3 * Math.pow(Math.sin(Math.PI * y), 3) * Math.min(1, Math.sin(Math.PI * xx) * 4 + .6);
      p[i] = p[i + 1] = p[i + 2] = 255;
    }
    x.putImageData(d, 0, 0); fogAlpha = c;
  } catch (e) { fogAlpha = null; }
}
const grain = document.createElement('canvas'); grain.width = grain.height = 128;
{ const g = grain.getContext('2d'), d = g.createImageData(128, 128); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

/* =========================================================================

   ========================================================================= */

const deco = (k, x, base, h, layer = 'play', flip = false) => ({ k, x, base, h, layer, flip });

const shiftDecor = (list, at, dx) => list.map(d => (d.layer === 'play' || d.layer === 'mid' || d.layer === 'bg' || d.layer === 'fg') && d.x >= at ? { ...d, x: d.x + dx } : d);

    decor: shiftDecor([
      deco('treeTall', 60, 262, 210, 'bg'), deco('treeSmall', 330, 262, 150, 'bg', true), deco('treeTall', 700, 262, 230, 'bg', true), deco('treeTall', 1150, 262, 200, 'bg'),
      deco('treeSmall', 1500, 262, 170, 'bg'), deco('treeTall', 1900, 262, 220, 'bg', true), deco('treeTall', 2350, 262, 210, 'bg'), deco('treeSmall', 2700, 262, 160, 'bg', true), deco('treeTall', 3050, 262, 200, 'bg'),
      deco('treeTall', 150, 228, 120, 'mid'), deco('roots', 628, 236, 34, 'play', true), deco('grass', 520, 234, 26), deco('thorns', 1158, 272, 30), deco('thorns', 1142, 272, 26, 'play', true),

function level3() { // LA LLUVIA — the flooded street: a raft on the current, a rope up the far bank
  return { name: 'La lluvia', theme: 'rain', w: 3950, closed: true, rough: 9, flat: [[860, 1120, .8], [1230, 1520, .8], [2120, 2310, 0]],
    terrain: [

    ],

  if (th === 'cave' && IMG.rootCurtain) for (let i = Math.floor(cam * 1.3 / 170) - 1; i < Math.floor(cam * 1.3 / 170) + 5; i++) { if (hash(i * 3) < .4) continue; const im = IMG.rootCurtain, h = 50 + hash(i) * 40, w = im.width * h / im.height; c.drawImage(im, i * 170 - cam * 1.3, -8, w, h); }
  ambience(c, t);
  if (th === 'rain') {
    c.strokeStyle = 'rgba(210,210,215,.28)'; c.lineWidth = .8; c.beginPath();
    for (let i = 0; i < 140; i++) { const x = ((i * 137.5 - t * 60 - cam * .2) % 560 + 560) % 560 - 40, y = ((i * 71.3 + t * 480) % (VH + 20)) - 10; c.moveTo(x, y); c.lineTo(x - 2.5, y + 10); }
    c.stroke();
  }
  // light from above, vignette, grain, flicker
  const lg = c.createLinearGradient(0, 0, 0, VH); lg.addColorStop(0, 'rgba(255,255,255,.07)'); lg.addColorStop(.5, 'rgba(255,255,255,0)'); c.fillStyle = lg; c.fillRect(0, 0, VW, VH);
  const vg = c.createRadialGradient(VW / 2, VH * .45, VH * .25, VW / 2, VH / 2, VW * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.88)'); c.fillStyle = vg; c.fillRect(-10, -10, VW + 20, VH + 20);
  if (!RM) {
    c.globalAlpha = .09; c.globalCompositeOperation = 'overlay';
    const gx = Math.floor(Math.random() * 128), gy = Math.floor(Math.random() * 128);
    for (let x = -gx; x < VW; x += 128) for (let y = -gy; y < VH; y += 128) c.drawImage(grain, x, y);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.fillStyle = `rgba(0,0,0,${Math.random() * .06})`; c.fillRect(0, 0, VW, VH);
    if (Math.random() < .06) { c.strokeStyle = `rgba(230,230,225,${.06 + Math.random() * .08})`; c.lineWidth = .5; const x = Math.random() * VW; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + (Math.random() - .5) * 5, VH); c.stroke(); }
  }
  if (S.dead) { const k = Math.max(0, (S.dead.t - .9) / 1.1); c.fillStyle = `rgba(0,0,0,${Math.min(1, k)})`; c.fillRect(-10, -10, VW + 20, VH + 20); }
}

function ambience(c, t) {
  const th = L.theme;
  if (th === 'forest' || th === 'dream') { // leaves drifting down
    c.fillStyle = 'rgba(8,8,8,.85)';
    for (let i = 0; i < 18; i++) {
      const sp = 14 + hash(i) * 16, y = ((t * sp + hash(i * 3) * 400) % (VH + 40)) - 20, x = ((hash(i * 7) * 700 - cam * (.6 + hash(i) * .6) + Math.sin(t * .8 + i) * 22) % 560 + 560) % 560 - 40;
      c.save(); c.translate(x, y); c.rotate(t * (1 + hash(i)) + i); c.beginPath(); c.ellipse(0, 0, 2.4, 1.1, 0, 0, 7); c.fill(); c.restore();
    }
  }
  if (th === 'cave') { c.fillStyle = 'rgba(210,210,205,.35)'; for (let i = 0; i < 26; i++) { const x = ((hash(i * 5) * 600 - cam * .7 + Math.sin(t * .3 + i) * 12) % 540 + 540) % 540 - 30, y = hash(i * 9) * VH + Math.sin(t * .4 + i) * 8; c.fillRect(x, y, .8, .8); } }
  // a crow now and then, crossing the sky
  const cw = IMG.crow; if (cw && th !== 'cave') { const per = 19, k = (t % per) / per, n = Math.floor(t / per); if (k < .35) { const x = VW + 30 - k / .35 * (VW + 90), y = 40 + hash(n) * 60 + Math.sin(k * 40) * 3, h = 12; c.save(); c.globalAlpha = .8; c.translate(x, y); c.scale(-1, 1); c.drawImage(cw, 0, 0, cw.width * h / cw.height, h); c.restore(); } }
}

/* ---------- loop ---------- */
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
introCard(true);
loadAll().then(() => {
  makeFog();
  L = build(0); S.cp = 0; spawn(); hud();
  introCard();
  requestAnimationFrame(frame);
});
})();
</script>
