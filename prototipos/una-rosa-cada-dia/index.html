<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Una rosa cada día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Gochi+Hand&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1c1726; --panel:#2a2238; --line:#3b3150;
  --text:#efe6f0; --muted:#b3a5bd; --rose:#d6456b; --rose2:#f2b8c9; --gold:#e8c07a;
}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:16px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(24px,4vw,36px);margin:0;letter-spacing:-.01em}
#hud{display:flex;gap:14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#241c46}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:480/272}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(28,23,38,.8);border-radius:12px;padding:8px 14px;font-family:'Gochi Hand',cursive;font-size:clamp(16px,2.4vw,21px);color:var(--rose2);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#toast.show{opacity:1}
#toast small{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.help{margin:0;font-size:13px;color:var(--muted)}
.help kbd{font:600 12px 'Figtree',system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:12px}
.pad button{width:72px;height:72px;border-radius:50%;font-size:22px;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--text);touch-action:none}
.pad button.jump{width:96px;background:var(--rose);border:0;font-size:15px}
.pad button.held{filter:brightness(1.35)}
@media (pointer:coarse){.pad{display:flex}.help{display:none}}
button{font:600 15px 'Figtree',system-ui,sans-serif;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#card{position:fixed;inset:0;z-index:30;background:rgba(28,23,38,.84);display:grid;place-items:center;padding-inline:16px;overflow-y:auto}
#card.soft{background:rgba(28,23,38,.45);place-items:end center}
#card.soft .in{background:rgba(28,23,38,.88);border-radius:14px;padding-inline:20px;margin-block-end:16px}
#card .in{max-width:540px;width:100%;display:flex;flex-direction:column;gap:14px;padding-block:24px;animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
#cTitle{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.05;text-wrap:balance}
#cLines{display:flex;flex-direction:column;gap:12px}
#cLines p{margin:0;font-size:17px;line-height:1.55}
#cLines p.hand{font-family:'Gochi Hand',cursive;font-size:24px;line-height:1.3;color:var(--rose2)}
#cLines .who{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
#cLines p.big{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:clamp(22px,4vw,30px);line-height:1.3;text-wrap:balance}
#cLines p.hint{font-size:14px;color:var(--muted)}
#cNames{display:flex;flex-direction:column;gap:12px}
#cNames label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
#cNames input{font:16px 'Figtree',system-ui,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){#card.soft{background:rgba(28,23,38,.45);place-items:end center}
#card.soft .in{background:rgba(28,23,38,.88);border-radius:14px;padding-inline:20px;margin-block-end:16px}
#card .in{animation:none}#toast{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Una rosa cada día</h1>
    <div id="hud"><span id="hDay">Día 1 de 5</span><span id="hMem">Recuerdos 0/3</span></div>
  </header>
  <div class="stage">
    <canvas id="game" aria-label="Juego de plataformas: el jardín a la izquierda, la casa gris a la derecha."></canvas>
    <div id="toast"></div>
  </div>
  <p class="help"><kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd> para moverte · <kbd>↑</kbd>, <kbd>W</kbd> o <kbd>Espacio</kbd> para saltar</p>
  <div class="pad">
    <div><button data-k="l" aria-label="Izquierda">◀</button><button data-k="r" aria-label="Derecha">▶</button></div>
    <button class="jump" data-k="j">Saltar</button>
  </div>
</div>

<div id="card" hidden>
  <div class="in">
    <h2 id="cTitle"></h2>
    <div id="cLines"></div>
    <div id="cNames" hidden>
      <label for="nameH">¿Cómo se llamaba tu hermano? (opcional)
        <input id="nameH" maxlength="24" autocomplete="off" placeholder="tu hermano">
      </label>
      <label for="nameM">¿Cómo le dicen a tu mamá? (opcional)
        <input id="nameM" maxlength="24" autocomplete="off" placeholder="mamá">
      </label>
    </div>
    <div><button id="cBtn"></button></div>
  </div>
</div>

<script>
(() => {
const T = 16, ROWS = 17, VW = 480, VH = 272;
const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
const wcv = document.createElement('canvas'), wctx = wcv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

let names = { h: '', m: '' };
try { const n = JSON.parse(localStorage.getItem('rosa-names') || 'null'); if (n) names = n; } catch (e) {}
const Hn = () => names.h.trim() || 'tu hermano';
const Mn = () => names.m.trim() || 'tu mamá';
const Ms = () => names.m.trim() || 'mamá';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const S = { color: .05, dc: .05, roses: 0, level: 0, state: 'card', t: 0, flash: 0, memGot: 0, timer: 0, endStep: 0, resp: null };
let L = null, P = null, cam = 0;

/* ---------- color ---------- */
const hc = {};
const rgb = h => hc[h] || (hc[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const mixc = (a, b, t) => { const A = rgb(a), B = rgb(b); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; };
function gr(c, g) {
  const l = c[0] * .3 + c[1] * .59 + c[2] * .11, k = 1 - g * .15;
  return `rgb(${(c[0] + (l - c[0]) * g) * k | 0},${(c[1] + (l - c[1]) * g) * k | 0},${(c[2] + (l - c[2]) * g) * k | 0})`;
}
const tc = (h, g) => gr(rgb(h), g);
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const worldness = wx => smooth(.34, .5, wx / (L.w * T));
const grayAt = wx => worldness(wx) * (1 - S.dc);

/* ---------- levels ---------- */
function mk(w) { return { w, g: Array.from({ length: ROWS }, () => Array(w).fill('.')), mem: [], movers: [], checks: [], startCol: 2, goalCol: w - 12, flip: false, rain: false, closed: false }; }
const ground = (L, a, b, top = 15) => { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) L.g[y][x] = '#'; };
const plat = (L, x, y, w) => { for (let i = 0; i < w; i++) L.g[y][x + i] = '='; };
const fog = (L, a, b, y = 14) => { for (let x = a; x <= b; x++) L.g[y][x] = '~'; };
const mem = (L, x, y) => L.mem.push({ x: x * T + 8, y: y * T + 8, got: false });
const check = (L, x) => L.checks.push({ x: x * T + 8, col: x, on: false });
const mover = (L, x, y, w, range, sp = 1) => L.movers.push({ bx: x * T, y: y * T, w: w * T, range: range * T, sp, x: x * T, dx: 0, ph: 0 });
function topOf(col) { for (let y = 0; y < ROWS; y++) if (L.g[y][col] === '#') return y; return ROWS; }
function mirror(L) {
  const WX = L.w * T;
  L.g = L.g.map(r => r.slice().reverse());
  L.mem.forEach(m => m.x = WX - m.x);
  L.movers.forEach(m => m.bx = WX - m.bx - m.w);
  L.checks.forEach(c => { c.x = WX - c.x; c.col = L.w - 1 - c.col; });
  L.startCol = L.w - 1 - L.startCol; L.flip = true;
}

const LEVELS = [
  () => { const L = mk(96);
    ground(L, 0, 22); ground(L, 26, 39); ground(L, 40, 44, 13); plat(L, 30, 12, 4); mem(L, 31, 10);
    ground(L, 45, 60); check(L, 47); fog(L, 52, 54); mem(L, 53, 11);
    ground(L, 64, 95); mem(L, 70, 12); L.goalCol = 84; return L; },
  () => { const L = mk(120);
    ground(L, 0, 18); ground(L, 22, 34);
    plat(L, 37, 13, 3); plat(L, 41, 11, 3); plat(L, 46, 13, 3); mem(L, 42, 8);
    ground(L, 50, 62); check(L, 52);
    mover(L, 67, 13, 3, 3, 1.1); mem(L, 68, 10);
    ground(L, 74, 119); check(L, 77); fog(L, 80, 81); plat(L, 84, 12, 4); mem(L, 86, 10); fog(L, 89, 91);
    L.goalCol = 106; return L; },
  () => { const L = mk(124); L.rain = true; L.closed = true;
    ground(L, 0, 16); ground(L, 20, 30); fog(L, 24, 26); plat(L, 24, 12, 3); mem(L, 25, 10);
    ground(L, 31, 35, 13); ground(L, 36, 44); check(L, 38);
    plat(L, 47, 13, 2); plat(L, 51, 11, 2); plat(L, 55, 13, 2); mem(L, 51, 8);
    ground(L, 59, 72); check(L, 61); fog(L, 64, 66); fog(L, 69, 70);
    mover(L, 76, 13, 3, 2, 1.3); mem(L, 77, 10);
    ground(L, 82, 123); check(L, 85); fog(L, 90, 92);
    L.goalCol = 110; return L; },
  () => { const L = mk(128);
    ground(L, 0, 18); ground(L, 19, 22, 13); ground(L, 23, 26, 11); mem(L, 25, 8); ground(L, 27, 34); check(L, 30);
    mover(L, 38, 12, 3, 2, 1.2); plat(L, 46, 11, 2); mem(L, 46, 8);
    ground(L, 50, 64); check(L, 52); fog(L, 55, 57); plat(L, 55, 12, 3); fog(L, 60, 61);
    plat(L, 67, 13, 2); plat(L, 71, 12, 2); plat(L, 75, 13, 2); mem(L, 71, 9);
    ground(L, 78, 127); check(L, 80); fog(L, 85, 87); fog(L, 92, 93);
    L.goalCol = 112; return L; },
  () => { const L = mk(90);
    ground(L, 0, 22); ground(L, 25, 40); plat(L, 29, 12, 4); mem(L, 30, 10);
    ground(L, 41, 60); check(L, 44); fog(L, 48, 50); mem(L, 49, 11);
    ground(L, 63, 89); mem(L, 70, 12);
    mirror(L); L.mom = true; return L; },
];

const MEMTXT = [
  ['Cuando me cantaba para dormir.', 'Sus manos oliendo a jabón.', '«Cuídate, mi amor», cada mañana.'],
  ['La playa. Yo no quería salir del agua.', 'Cuando me curó la rodilla sin regañarme.', 'Su café de las siete.'],
  ['Las noches que me esperó despierta.', 'Cuando lloró de risa con mi chiste malo.', 'Su abrazo cuando tuve miedo.'],
  ['La canción que cantábamos en el carro.', 'Mi dibujo pegado en la nevera.', '«Te quiero hasta el cielo.»'],
  ['Sus zapatos siempre tirados en la entrada.', 'Su taza de dinosaurios.', '«Mamá, cuando tú mueras…»'],
];
const INTRO = [
  { title: 'Día 1', lines: [
    { t: () => `Del otro lado del jardín está la casa. ${cap(Mn())} sigue viva, pero una parte de ella se fue contigo, y su mundo se quedó sin color.` },
    { hand: 'Te lo prometí, ma. Una rosa todos los días.' },
    { hint: 'Llévale la rosa hasta su ventana. Las luces son recuerdos: le devuelven color al mundo. Si tocas la niebla gris, vuelves a la última flor.' }] },
  { title: 'Día 2', lines: [{ t: 'Anoche ella durmió un poco más.' }, { hand: 'Esta huele a tu champú, ¿te acuerdas?' }] },
  { title: 'Día 3', lines: [{ t: 'Hoy es un día malo. Del otro lado está lloviendo.' }, { hand: 'Hoy está difícil, ¿verdad? Igual te la llevo.' }] },
  { title: 'Día 4', lines: [{ t: 'Ella ya da los buenos días. Bajito, pero los da.' }, { hand: 'Ya casi, ma. Lo veo desde aquí.' }] },
  { title: 'La última noche', lines: [{ t: () => `Esa noche, ${Mn()} sueña con un jardín. Esta vez juegas como ella.` }, { hint: 'Camina hacia la luz. Él te está esperando.' }] },
];
const GOAL = [
  () => `Dejas la rosa en su ventana. ${cap(Mn())} la mira un largo rato. No sonríe, pero la mira.`,
  () => 'Esta vez la toma. La pone en un vaso con agua, junto a la de ayer.',
  () => 'La ventana está cerrada. Dejas la rosa en el borde, bajo la lluvia. Mañana la va a encontrar.',
  () => 'La ventana ya está abierta cuando llegas. Como si te estuviera esperando.',
];
const GAIN = [.08, .08, .03, .08];
const END = [
  [{ hand: 'Hola, ma. Esta te la guardé.' }],
  [{ t: 'Ella la toma. Lo abraza. Quiere quedarse ahí con él.' }],
  [{ hand: 'No, ma. Allá te están esperando. Yo te sigo mandando una todos los días.' }],
  [{ t: () => `Al despertar, ${Mn()} abre las cortinas ella sola. En la ventana hay cuatro rosas.` },
   { big: 'Una parte de ella se fue con él. Pero el resto se quedó con nosotros.' }],
];

/* ---------- drawing helpers ---------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circ(c, x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
function roseHead(c, x, y, r, col = '#d6456b') {
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; circ(c, x + Math.cos(a) * r * .45, y + Math.sin(a) * r * .45, r * .6, col); }
  circ(c, x, y, r * .55, '#b8325a');
}
function stand(c, o) {
  const u = o.h / 100, f = o.face || 1, s = o.step || 0, la = o.air ? 4 : Math.sin(s) * 6;
  c.save(); c.translate(o.x, o.base); c.scale(f * u, u);
  if (o.glow) {
    const g = c.createRadialGradient(0, -55, 5, 0, -55, 80);
    g.addColorStop(0, 'rgba(255,225,160,.4)'); g.addColorStop(1, 'rgba(255,225,160,0)');
    c.fillStyle = g; c.fillRect(-90, -140, 180, 160);
  }
  c.fillStyle = o.legs; rr(c, -9 + la, -40, 8, o.air ? 32 : 40, 3); c.fill(); rr(c, 1 - la, -40, 8, 40, 3); c.fill();
  c.fillStyle = '#2c2a3a'; rr(c, -10 + la, o.air ? -12 : -4, 11, 5, 2); c.fill(); rr(c, 1 - la, -4, 11, 5, 2); c.fill();
  c.fillStyle = o.shirt; rr(c, -12, -76, 24, 42, 9); c.fill();
  if (o.skirt) { c.fillStyle = o.skirt; c.beginPath(); c.moveTo(-12, -42); c.lineTo(12, -42); c.lineTo(18, -12); c.lineTo(-18, -12); c.closePath(); c.fill(); }
  const hy = -90;
  circ(c, -3, hy - 2, 13, o.hair); if (o.bun) circ(c, -13, hy - 8, 6.5, o.hair);
  circ(c, 2, hy, 11.5, o.skin);
  c.fillStyle = o.hair; c.beginPath(); c.arc(0, hy - 3, 13, Math.PI * 1.05, Math.PI * 1.98); c.fill();
  if (o.spiky) { c.beginPath(); c.moveTo(-11, hy - 9); c.lineTo(-7, hy - 21); c.lineTo(-2, hy - 13); c.lineTo(3, hy - 22); c.lineTo(6, hy - 13); c.lineTo(12, hy - 18); c.lineTo(12, hy - 7); c.closePath(); c.fill(); }
  circ(c, 8, hy - 1, 2, '#2b1d17');
  c.save(); c.translate(3, -70); c.rotate(-.15 - (o.arm || 0) * 1.2);
  c.fillStyle = o.shirt; rr(c, -4, 0, 8, 28, 4); c.fill(); circ(c, 0, 30, 4, o.skin);
  if (o.rose) { c.strokeStyle = '#3f7a4a'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 30); c.lineTo(0, 44); c.stroke(); roseHead(c, 0, 48, 9); }
  c.restore();
  c.restore();
}
const BRO = { shirt: '#e8c07a', legs: '#34406b', skin: '#d9a07c', hair: '#2b1d17', spiky: true, glow: true };
const MOMC = { shirt: '#3f8a80', legs: '#e0a582', skirt: '#4b4e6e', skin: '#e0a582', hair: '#3b2a22' };

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 50 }, () => ({ x: rnd() * VW, y: rnd() * 150, r: rnd() < .2 ? 2 : 1.2, k: .5 + rnd() * 1.5, p: rnd() * 6 }));
const HOUSECOL = ['#e7a980', '#d9c26a', '#8fb8d8', '#c98bb0', '#9ccf9a'];
const RAIN = Array.from({ length: 90 }, () => ({ x: rnd() * VW, y: rnd() * VH, s: 5 + rnd() * 3 }));

/* ---------- house on the goal side ---------- */
function house(c, x, t) {
  const g = grayAt(x + 60), gy = 240, lift = Math.min(1, S.dc * 1.15);
  c.fillStyle = tc('#e7a980', g); c.fillRect(x, gy - 110, 120, 110);
  c.fillStyle = tc('#8b3a3a', g); c.beginPath(); c.moveTo(x - 10, gy - 108); c.lineTo(x + 60, gy - 150); c.lineTo(x + 130, gy - 108); c.closePath(); c.fill();
  c.fillStyle = tc('#6e3f24', g); c.fillRect(x + 80, gy - 44, 26, 44); circ(c, x + 101, gy - 22, 1.8, tc('#e8c07a', g));
  // window
  const wx = x + 20, wy = gy - 86;
  c.fillStyle = tc('#f4e3d0', g); c.fillRect(wx - 3, wy - 3, 48, 42);
  c.fillStyle = tc('#fbe9c6', g * .6); c.fillRect(wx, wy, 42, 36);
  if (!L.closed) {
    const drop = (1 - lift) * 6;
    circ(c, wx + 23, wy + 20 + drop, 8.5, tc('#3b2a22', g)); circ(c, wx + 29, wy + 16 + drop, 4.5, tc('#3b2a22', g));
    circ(c, wx + 20, wy + 21 + drop, 7.5, tc('#e0a582', g));
    c.fillStyle = tc('#3b2a22', g); c.beginPath(); c.arc(wx + 21, wy + 18 + drop, 8.5, Math.PI * 1.05, Math.PI * 1.95); c.fill();
    c.fillStyle = tc('#3f8a80', g); rr(c, wx + 11, wy + 28 + drop * .5, 22, 12, 6); c.fill();
    if (lift > .45) circ(c, wx + 16, wy + 20 + drop, 1.2, '#2b1d17');
    else { c.strokeStyle = '#2b1d17'; c.lineWidth = 1; c.beginPath(); c.moveTo(wx + 14, wy + 21 + drop); c.lineTo(wx + 18, wy + 22 + drop); c.stroke(); }
  }
  c.fillStyle = tc('#5b7fc4', g);
  if (L.closed) { c.fillRect(wx, wy, 21, 36); c.fillRect(wx + 21, wy, 21, 36); }
  else { c.fillRect(wx, wy, 7, 36); c.fillRect(wx + 35, wy, 7, 36); }
  c.fillStyle = tc('#f4e3d0', g); c.fillRect(wx + 20, wy, 2, 36); c.fillRect(wx, wy + 17, 42, 2);
  if (L.rain) { c.fillStyle = 'rgba(200,210,225,.25)'; c.fillRect(wx, wy, 42, 36); }
  // sill with the roses that already arrived
  c.fillStyle = tc('#f4e3d0', g); c.fillRect(wx - 6, wy + 38, 54, 5);
  for (let i = 0; i < S.roses; i++) {
    const rx = wx + 4 + i * 10;
    c.strokeStyle = '#3f7a4a'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(rx, wy + 38); c.lineTo(rx + 1, wy + 30); c.stroke();
    roseHead(c, rx + 1, wy + 29, 3.6);
  }
}
const sill = () => ({ x: L.houseX + 24 + S.roses * 10, y: 240 - 86 + 29 });

/* ---------- level start ---------- */
function startLevel(i) {
  S.level = i; L = LEVELS[i]();
  const WX = L.w * T;
  const order = L.mem.slice().sort((a, b) => L.flip ? b.x - a.x : a.x - b.x);
  order.forEach((m, k) => m.text = MEMTXT[i][k]);

/* ---------- input ---------- */

/* ---------- physics ---------- */

  roseHead(c, ax - 30, 214, 4.5); roseHead(c, ax + 30, 206, 4.5);

    c.strokeStyle = tc('#3f7a4a', g); c.lineWidth = 1.5; c.beginPath(); c.moveTo(ck.x, gy - 8); c.lineTo(ck.x, gy - 20); c.stroke();
    if (ck.on) { circ(c, ck.x, gy - 22, 9, 'rgba(255,225,160,.25)'); roseHead(c, ck.x, gy - 22, 5); }
